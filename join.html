<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/favicon.png">
  <title>Únete · Enla Cards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app/assets/app.css?v=20260927-walletjoin1">
</head>
<body>
<main class="public-shell join-public-shell">
  <div class="public-wrap join-public-wrap">
    <section class="join-card" id="box">
      <p class="muted" style="text-align:center">Cargando programa...</p>
    </section>

    <footer class="join-powered">
      <span>Creado con</span>
      <img src="/assets/enla-cards-logo.png" alt="Enla Cards">
    </footer>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/app/assets/config.js?v=20260906-geonotify1"></script>
<script src="/app/assets/app.js?v=20260906-geonotify1"></script>
<script>
(async () => {
  const box = document.querySelector('#box');

  try {
    ENLA.ensureConfigured();

    const queryProgram = new URLSearchParams(location.search).get('p');
    const shortPath = location.hostname.replace(/^www\./,'') === 'enla.cards'
      ? location.pathname.split('/').filter(Boolean)[0] || ''
      : '';
    const programSlug = queryProgram || shortPath;
    if (!programSlug) throw new Error('Falta la tarjeta en este enlace.');

    const { data, error } = await ENLA.sb.rpc('rewards_public_program_card', {
      p_program_slug: programSlug
    });
    if (error) throw error;

    const p = data?.[0];
    if (!p) throw new Error('Este programa no existe o todavía no está activo.');

    const isAccess = p.program_type === 'access';
    const detail =
      p.program_type === 'cashback'
        ? '💵 Acumula saldo en pesos y úsalo en el negocio'
        : p.program_type === 'visits'
          ? `🎟️ Incluye ${p.goal_count} visitas.`
          : isAccess
            ? `🪪 ${p.service_name || p.program_name} · Vigencia inicial: ${p.validity_days || 30} días`
            : `🎁 ${p.reward_text} · Meta: ${p.goal_count} sellos`;

    const promoImage =
      p.program_type !== 'stamps' &&
      p.central_image_url &&
      p.card_style === 'promo'
        ? `<img class="customer-promo-image join-promo-image" src="${p.central_image_url}" alt="Promoción">`
        : '';

    const currentYear = new Date().getFullYear();
    const monthOptions = [
      ['01','Enero'],['02','Febrero'],['03','Marzo'],['04','Abril'],
      ['05','Mayo'],['06','Junio'],['07','Julio'],['08','Agosto'],
      ['09','Septiembre'],['10','Octubre'],['11','Noviembre'],['12','Diciembre']
    ].map(([value,label]) => `<option value="${value}">${label}</option>`).join('');

    box.innerHTML = `
      <div class="join-head">
        ${p.logo_url ? `<img class="join-logo" src="${p.logo_url}" alt="Logo de ${p.display_name || p.business_name}">` : ''}
        <h1>${p.display_name || p.business_name}</h1>
        <p class="muted">${p.program_name}</p>
      </div>

      <div class="join-promo" style="--program-color:${p.primary_color || '#4499f7'}">
        <b>${p.promo_text || 'Guarda tu tarjeta digital en tu Wallet'}</b>
        <div class="small muted" style="margin-top:5px">${detail}</div>
      </div>

      ${promoImage}

      <form id="joinForm" class="form-grid join-form" novalidate>
        <div class="field">
          <label for="name">Tu nombre</label>
          <input id="name" required autocomplete="name" placeholder="Nombre completo">
        </div>

        ${isAccess ? `
          <div class="field">
            <label>Tu foto</label>
            <div class="customer-photo-upload">
              <img id="photoPreview" class="customer-photo-preview" alt="Vista previa de tu foto">
              <div>
                <input id="photo" type="file" accept="image/png,image/jpeg,image/webp" capture="user" required>
                <div class="small muted" style="margin-top:5px">
                  Se usará para que el negocio confirme tu identidad al escanear.
                </div>
              </div>
            </div>
          </div>` : ''}

        <div class="field">
          <label for="email">Correo</label>
          <input id="email" type="email" autocomplete="email" placeholder="tu@correo.com" required>
        </div>

        <div class="field">
          <label>Fecha de nacimiento</label>
          <div class="birthday-fields">
            <div>
              <span>Día</span>
              <input id="birthDay" type="number" inputmode="numeric" min="1" max="31" placeholder="DD" required>
            </div>
            <div>
              <span>Mes</span>
              <select id="birthMonth" required>
                <option value="">Mes</option>
                ${monthOptions}
              </select>
            </div>
            <div>
              <span>Año</span>
              <input id="birthYear" type="number" inputmode="numeric" min="1900" max="${currentYear}" placeholder="AAAA" required>
            </div>
          </div>
          <small class="field-help">
            El negocio podrá usarla para felicitarte en tu cumpleaños si tiene activadas esas notificaciones.
          </small>
        </div>

        <div id="otpPanel" class="otp-panel hidden">
          <div class="otp-icon">✉️</div>
          <div>
            <b>Confirma que este correo es tuyo</b>
            <p id="otpCopy">Ya existe una tarjeta registrada con este correo. Te enviamos un código para recuperarla.</p>
          </div>
          <div class="otp-entry">
            <input id="otpCode" type="text" inputmode="numeric" autocomplete="one-time-code"
                   maxlength="8" placeholder="Código">
            <button id="verifyOtpBtn" class="btn btn-secondary" type="button">Confirmar código</button>
          </div>
          <button id="resendOtpBtn" class="otp-resend" type="button">Reenviar código</button>
        </div>

        <div id="notice" class="hidden"></div>
      </form>

      <div class="wallet-join-zone">
        <div class="wallet-join-label">Guárdala en tu celular</div>
        <div id="walletButtons" class="wallet-join-buttons"></div>
        <p id="walletHint" class="wallet-hint"></p>
      </div>
    `;

    const form = document.querySelector('#joinForm');
    const notice = document.querySelector('#notice');
    const otpPanel = document.querySelector('#otpPanel');
    const otpCode = document.querySelector('#otpCode');
    const verifyOtpBtn = document.querySelector('#verifyOtpBtn');
    const resendOtpBtn = document.querySelector('#resendOtpBtn');
    const walletButtons = document.querySelector('#walletButtons');
    const walletHint = document.querySelector('#walletHint');

    let photoFile = null;
    let pendingWallet = null;
    let pendingPayload = null;
    let otpEmail = null;
    let otpSending = false;

    // Cliente de autenticación temporal: verificar un correo no modifica la sesión
    // que el dueño del negocio pueda tener abierta en este mismo navegador.
    const verificationClient = window.supabase.createClient(
      window.ENLA_CONFIG.SUPABASE_URL,
      window.ENLA_CONFIG.SUPABASE_ANON_KEY,
      {
        auth: {
          persistSession: false,
          autoRefreshToken: false,
          detectSessionInUrl: false
        }
      }
    );

    if (isAccess) {
      const photoInput = document.querySelector('#photo');
      const photoPreview = document.querySelector('#photoPreview');

      photoInput.onchange = (e) => {
        photoFile = e.target.files[0] || null;
        if (photoFile) photoPreview.src = URL.createObjectURL(photoFile);
      };
    }

    function showNotice(message, type = 'error') {
      ENLA.msg(notice, message, type);
      notice.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function hideNotice() {
      notice.classList.add('hidden');
    }

    function getDevice() {
      const ua = navigator.userAgent || '';
      const platform = navigator.userAgentData?.platform || navigator.platform || '';
      const touchMac = /Mac/i.test(platform) && navigator.maxTouchPoints > 1;

      if (/iPhone|iPad|iPod/i.test(ua) || touchMac) return 'ios';
      if (/Android/i.test(ua)) return 'android';
      return 'desktop';
    }

    const appleEnabled = p.apple_enabled !== false;
    const googleEnabled = p.google_enabled !== false;
    const device = getDevice();

    function walletButton(type) {
      if (type === 'apple') {
        return `<button type="button" class="wallet-action wallet-action-apple" data-wallet="apple">
          <span class="wallet-apple-mark"></span>
          <span><small>Agregar a</small><strong>Apple Wallet</strong></span>
        </button>`;
      }
      return `<button type="button" class="wallet-action wallet-action-google" data-wallet="google">
        <span class="wallet-google-mark">G</span>
        <span><small>Agregar a</small><strong>Google Wallet</strong></span>
      </button>`;
    }

    let visibleWallets = [];
    if (device === 'ios') {
      if (appleEnabled) visibleWallets.push('apple');
      else if (googleEnabled) visibleWallets.push('google');
    } else if (device === 'android') {
      if (googleEnabled) visibleWallets.push('google');
      else if (appleEnabled) visibleWallets.push('apple');
    } else {
      if (appleEnabled) visibleWallets.push('apple');
      if (googleEnabled) visibleWallets.push('google');
    }

    if (!visibleWallets.length) {
      walletButtons.innerHTML = `<div class="wallet-unavailable">Este negocio todavía no tiene Wallet habilitado.</div>`;
      walletHint.textContent = '';
    } else {
      walletButtons.innerHTML = visibleWallets.map(walletButton).join('');
      walletHint.textContent =
        device === 'ios'
          ? 'Detectamos un dispositivo Apple.'
          : device === 'android'
            ? 'Detectamos un dispositivo Android.'
            : 'Elige dónde quieres guardar tu tarjeta.';
    }

    function buildBirthDate() {
      const day = Number(document.querySelector('#birthDay').value);
      const month = Number(document.querySelector('#birthMonth').value);
      const year = Number(document.querySelector('#birthYear').value);

      if (!day || !month || !year) throw new Error('Completa tu fecha de nacimiento.');
      if (year < 1900 || year > currentYear) throw new Error('Escribe un año válido.');

      const dt = new Date(Date.UTC(year, month - 1, day));
      if (
        dt.getUTCFullYear() !== year ||
        dt.getUTCMonth() !== month - 1 ||
        dt.getUTCDate() !== day ||
        dt.getTime() > Date.now()
      ) {
        throw new Error('Escribe una fecha de nacimiento válida.');
      }

      return `${String(year).padStart(4, '0')}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    }

    function validateAndBuildPayload() {
      hideNotice();

      const name = document.querySelector('#name').value.trim();
      const emailInput = document.querySelector('#email');
      const email = emailInput.value.trim().toLowerCase();

      if (name.length < 2) {
        document.querySelector('#name').focus();
        throw new Error('Primero escribe tu nombre.');
      }
      if (!email || !emailInput.checkValidity()) {
        emailInput.focus();
        throw new Error('Primero escribe un correo válido.');
      }
      if (isAccess && !photoFile) {
        document.querySelector('#photo').focus();
        throw new Error('Primero sube tu foto.');
      }

      const birthDate = buildBirthDate();

      return {
        p_program_slug: programSlug,
        p_name: name,
        p_email: email,
        p_photo_url: null,
        p_birth_date: birthDate
      };
    }

    async function uploadPhoto(file) {
      if (!file) return null;

      const ext =
        (file.type || 'image/jpeg').includes('png') ? 'png' :
        (file.type || '').includes('webp') ? 'webp' : 'jpg';

      const rand = crypto.randomUUID
        ? crypto.randomUUID()
        : `${Date.now()}-${Math.random()}`;

      const path = `${programSlug}/${rand}.${ext}`;

      const { error } = await ENLA.sb.storage
        .from('rewards-customer-photos')
        .upload(path, file, {
          upsert: false,
          contentType: file.type || 'image/jpeg'
        });

      if (error) throw error;

      return ENLA.sb.storage
        .from('rewards-customer-photos')
        .getPublicUrl(path).data.publicUrl;
    }

    async function sendVerificationCode(email) {
      if (otpSending) return;
      otpSending = true;

      try {
        const { error } = await verificationClient.auth.signInWithOtp({
          email,
          options: { shouldCreateUser: true }
        });
        if (error) throw error;

        otpEmail = email;
        otpPanel.classList.remove('hidden');
        document.querySelector('#otpCopy').textContent =
          `Ya existe una tarjeta con ${email}. Te enviamos un código para confirmar que eres tú.`;
        otpCode.value = '';
        setTimeout(() => otpCode.focus(), 100);
        showNotice('Revisa tu correo e ingresa el código de confirmación.', 'success');
      } finally {
        otpSending = false;
      }
    }

    function isConfirmEmailError(error) {
      return String(error?.message || error || '').includes('CONFIRM_EMAIL');
    }

    async function createOrRecoverCustomer(client, payload) {
      const { data, error } = await client.rpc('rewards_join_program_wallet', payload);
      if (error) throw error;

      const row = data?.[0];
      if (!row?.public_code) throw new Error('No se pudo preparar tu tarjeta.');
      return row.public_code;
    }

    async function openWallet(type, publicCode) {
      if (type === 'apple') {
        location.href =
          `${window.ENLA_CONFIG.SUPABASE_URL}/functions/v1/apple-wallet-pass?c=${encodeURIComponent(publicCode)}`;
        return;
      }

      const response = await fetch(
        `${window.ENLA_CONFIG.SUPABASE_URL}/functions/v1/google-wallet-pass`,
        {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            apikey: window.ENLA_CONFIG.SUPABASE_ANON_KEY,
            Authorization: `Bearer ${window.ENLA_CONFIG.SUPABASE_ANON_KEY}`
          },
          body: JSON.stringify({ public_code: publicCode })
        }
      );

      const json = await response.json();
      if (!response.ok || !json.url) {
        throw new Error(json.error || 'No se pudo preparar Google Wallet.');
      }
      location.href = json.url;
    }

    async function startWalletFlow(type, authenticatedClient = null) {
      const button = document.querySelector(`[data-wallet="${type}"]`);
      const original = button?.innerHTML;

      try {
        const payload = pendingPayload || validateAndBuildPayload();

        if (isAccess && !payload.p_photo_url) {
          payload.p_photo_url = await uploadPhoto(photoFile);
        }

        pendingWallet = type;
        pendingPayload = payload;

        if (button) {
          button.disabled = true;
          button.classList.add('is-loading');
          button.innerHTML = `<span class="wallet-loader"></span><span><small>Preparando</small><strong>Tu tarjeta...</strong></span>`;
        }

        const client = authenticatedClient || ENLA.sb;
        const publicCode = await createOrRecoverCustomer(client, payload);

        otpPanel.classList.add('hidden');
        pendingPayload = null;
        pendingWallet = null;

        await openWallet(type, publicCode);
      } catch (err) {
        if (isConfirmEmailError(err) && pendingPayload?.p_email) {
          if (!otpPanel.classList.contains('hidden') && otpEmail === pendingPayload.p_email) {
            showNotice('Ingresa el código que enviamos a tu correo para continuar.');
          } else {
            await sendVerificationCode(pendingPayload.p_email);
          }
        } else {
          showNotice(err.message || String(err));
        }
      } finally {
        if (button && original) {
          button.disabled = false;
          button.classList.remove('is-loading');
          button.innerHTML = original;
        }
      }
    }

    walletButtons.addEventListener('click', (event) => {
      const button = event.target.closest('[data-wallet]');
      if (!button) return;

      // Si cambió el formulario después de pedir OTP, volveremos a validar desde cero.
      const currentEmail = document.querySelector('#email').value.trim().toLowerCase();
      if (otpEmail && currentEmail !== otpEmail) {
        otpEmail = null;
        pendingPayload = null;
        otpPanel.classList.add('hidden');
      }

      startWalletFlow(button.dataset.wallet);
    });

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const firstWallet = visibleWallets[0];
      if (firstWallet) startWalletFlow(firstWallet);
    });

    document.querySelector('#email').addEventListener('input', () => {
      const currentEmail = document.querySelector('#email').value.trim().toLowerCase();
      if (otpEmail && currentEmail !== otpEmail) {
        otpEmail = null;
        pendingPayload = null;
        otpPanel.classList.add('hidden');
      }
    });

    verifyOtpBtn.addEventListener('click', async () => {
      hideNotice();

      const token = otpCode.value.replace(/\s+/g, '');
      if (!otpEmail) {
        showNotice('Primero solicita un código de confirmación.');
        return;
      }
      if (token.length < 6) {
        otpCode.focus();
        showNotice('Escribe el código completo que llegó a tu correo.');
        return;
      }

      const original = verifyOtpBtn.textContent;
      verifyOtpBtn.disabled = true;
      verifyOtpBtn.textContent = 'Confirmando...';

      try {
        const { error } = await verificationClient.auth.verifyOtp({
          email: otpEmail,
          token,
          type: 'email'
        });
        if (error) throw error;

        showNotice('Correo confirmado. Preparando tu tarjeta...', 'success');

        if (!pendingWallet || !pendingPayload) {
          throw new Error('Vuelve a tocar el botón de Wallet para continuar.');
        }

        await startWalletFlow(pendingWallet, verificationClient);
      } catch (err) {
        showNotice(
          /expired|invalid|token/i.test(String(err?.message || err))
            ? 'El código no es válido o ya venció. Inténtalo de nuevo.'
            : (err.message || String(err))
        );
      } finally {
        verifyOtpBtn.disabled = false;
        verifyOtpBtn.textContent = original;
      }
    });

    resendOtpBtn.addEventListener('click', async () => {
      if (!otpEmail) {
        showNotice('Primero escribe tu correo y toca Agregar a Wallet.');
        return;
      }

      resendOtpBtn.disabled = true;
      const original = resendOtpBtn.textContent;
      resendOtpBtn.textContent = 'Enviando...';

      try {
        await sendVerificationCode(otpEmail);
      } catch (err) {
        showNotice(err.message || String(err));
      } finally {
        resendOtpBtn.disabled = false;
        resendOtpBtn.textContent = original;
      }
    });

  } catch (e) {
    box.innerHTML = `<div class="error">${e.message}</div>`;
  }
})();
</script>
</body>
</html>
