<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/favicon.png">
  <title>Únete · Enla Cards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app/assets/app.css?v=20260927-walletjoin1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@29.5.3/dist/css/intlTelInput.min.css">
  <style>
.join-form .iti{width:100%}
.join-form .iti input{width:100%;padding-left:92px!important}
.join-form .iti__country-container{border-radius:13px 0 0 13px}
.join-phone-help{display:block;margin-top:6px;color:#7b8d9f;font-size:11px;line-height:1.4}
.join-turnstile-overlay{
  position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;
  padding:20px;background:rgba(18,52,85,0);opacity:0;pointer-events:none;
  transition:opacity .18s ease,background .18s ease
}
.join-turnstile-overlay.is-active{
  opacity:1;pointer-events:auto;background:rgba(18,52,85,.28);backdrop-filter:blur(3px)
}
.join-turnstile-card{
  width:min(360px,calc(100vw - 28px));padding:16px;background:#fff;border-radius:20px;
  border:1px solid rgba(68,153,247,.18);box-shadow:0 24px 70px rgba(18,52,85,.28);
  transform:translateY(8px) scale(.985);transition:transform .18s ease
}
.join-turnstile-overlay.is-active .join-turnstile-card{transform:translateY(0) scale(1)}
.join-turnstile-title{margin:0 0 10px;text-align:center;color:#123455;font-size:13px;font-weight:800}
.join-turnstile{display:flex;justify-content:center;width:100%;min-height:65px}
.join-turnstile>div{width:100%;max-width:100%}
.wallet-action:disabled{opacity:.62;cursor:wait}
@media(max-width:480px){
  .join-turnstile-card{padding:14px}
  .join-turnstile{overflow:hidden}
}
</style>
</head>
<body>
<main class="public-shell join-public-shell">
  <div class="public-wrap join-public-wrap">
    <section class="join-card" id="box">
      <p class="muted" style="text-align:center">Cargando programa...</p>
    </section>

    <footer class="join-powered">
      <span>Creado con</span>
      <img src="/assets/enla-cards-logo.png" alt="Enla Cards">
    </footer>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/intl-tel-input@29.5.3/dist/js/intlTelInputWithUtils.min.js"></script>
<script src="/app/assets/config.js?v=20260906-geonotify1"></script>
<script src="/app/assets/app.js?v=20260906-geonotify1"></script>
<script>
(async () => {
  const box = document.querySelector('#box');

  try {
    ENLA.ensureConfigured();

    const queryProgram = new URLSearchParams(location.search).get('p');
    const shortPath = location.hostname.replace(/^www\./,'') === 'enla.cards'
      ? location.pathname.split('/').filter(Boolean)[0] || ''
      : '';
    const programSlug = queryProgram || shortPath;
    if (!programSlug) throw new Error('Falta la tarjeta en este enlace.');

    const { data, error } = await ENLA.sb.rpc('rewards_public_program_card', {
      p_program_slug: programSlug
    });
    if (error) throw error;

    const p = data?.[0];
    if (!p) throw new Error('Este programa no existe o todavía no está activo.');

    const isAccess = p.program_type === 'access';
    const detail =
      p.program_type === 'cashback'
        ? '💵 Acumula saldo en pesos y úsalo en el negocio'
        : p.program_type === 'visits'
          ? `🎟️ Incluye ${p.goal_count} visitas.`
          : isAccess
            ? `🪪 ${p.service_name || p.program_name} · Vigencia inicial: ${p.validity_days || 30} días`
            : `🎁 ${p.reward_text} · Meta: ${p.goal_count} sellos`;

    const promoImage =
      p.program_type !== 'stamps' &&
      p.central_image_url &&
      p.card_style === 'promo' && p.registration_promo_image_enabled !== false
        ? `<img class="customer-promo-image join-promo-image" src="${p.central_image_url}" alt="Promoción">`
        : '';

    const currentYear = new Date().getFullYear();
    const monthOptions = [
      ['01','Enero'],['02','Febrero'],['03','Marzo'],['04','Abril'],
      ['05','Mayo'],['06','Junio'],['07','Julio'],['08','Agosto'],
      ['09','Septiembre'],['10','Octubre'],['11','Noviembre'],['12','Diciembre']
    ].map(([value,label]) => `<option value="${value}">${label}</option>`).join('');

    box.innerHTML = `
      <div class="join-head">
        ${p.logo_url ? `<img class="join-logo" src="${p.logo_url}" alt="Logo de ${p.display_name || p.business_name}">` : ''}
        <h1>${p.display_name || p.business_name}</h1>
        <p class="muted">${p.program_name}</p>
      </div>

      <div class="join-promo" style="--program-color:${p.primary_color || '#4499f7'}">
        <b>${p.promo_text || 'Guarda tu tarjeta digital en tu Wallet'}</b>
        <div class="small muted" style="margin-top:5px">${detail}</div>
      </div>

      ${promoImage}

      <form id="joinForm" class="form-grid join-form" novalidate>
        <div class="field">
          <label for="name">Tu nombre</label>
          <input id="name" required autocomplete="name" placeholder="Nombre completo">
        </div>

        ${isAccess ? `
          <div class="field">
            <label>Tu foto</label>
            <div class="customer-photo-upload">
              <img id="photoPreview" class="customer-photo-preview" alt="Vista previa de tu foto">
              <div>
                <input id="photo" type="file" accept="image/png,image/jpeg,image/webp" capture="user" required>
                <div class="small muted" style="margin-top:5px">
                  Se usará para que el negocio confirme tu identidad al escanear.
                </div>
              </div>
            </div>
          </div>` : ''}

        <div class="field">
          <label for="email">Correo</label>
          <input id="email" type="email" autocomplete="email" placeholder="tu@correo.com" required>
        </div>

        ${p.registration_phone_enabled ? `
        <div class="field">
          <label for="phone">Número de teléfono</label>
          <input id="phone" type="tel" inputmode="tel" autocomplete="tel" required>
          <small class="join-phone-help">México (+52) aparece por defecto. Puedes elegir otro país tocando la bandera.</small>
        </div>` : ''}

        ${(p.registration_birth_date_enabled || p.birthday_enabled) ? `
        <div class="field">
          <label>Fecha de nacimiento</label>
          <div class="birthday-fields">
            <div>
              <span>Día</span>
              <input id="birthDay" type="number" inputmode="numeric" min="1" max="31" placeholder="DD" required>
            </div>
            <div>
              <span>Mes</span>
              <select id="birthMonth" required>
                <option value="">Mes</option>
                ${monthOptions}
              </select>
            </div>
            <div>
              <span>Año</span>
              <input id="birthYear" type="number" inputmode="numeric" min="1900" max="${currentYear}" placeholder="AAAA" required>
            </div>
          </div>
          <small class="field-help">
            El negocio podrá usarla para felicitarte en tu cumpleaños si tiene activadas esas notificaciones.
          </small>
        </div>
` : ''}

       <div id="otpPanel" class="otp-panel hidden">
          <div class="otp-icon">✉️</div>
          <div>
            <b>Confirma que este correo es tuyo</b>
            <p id="otpCopy">Ya existe una tarjeta registrada con este correo. Te enviamos un código para recuperarla.</p>
          </div>
          <div class="otp-entry">
            <input id="otpCode" type="text" inputmode="numeric" autocomplete="one-time-code"
                   maxlength="8" placeholder="Código">
            <button id="verifyOtpBtn" class="btn btn-secondary" type="button">Confirmar código</button>
          </div>
          <button id="resendOtpBtn" class="otp-resend" type="button">Reenviar código</button>
        </div>

        <div id="notice" class="hidden"></div>
      </form>

      <div class="wallet-join-zone">
        <div class="wallet-join-label">Guárdala en tu celular</div>
        <div id="walletButtons" class="wallet-join-buttons"></div>
        <p id="walletHint" class="wallet-hint"></p>
      </div>

      <div id="joinTurnstileOverlay" class="join-turnstile-overlay" aria-hidden="true">
        <div class="join-turnstile-card" role="dialog" aria-modal="true" aria-label="Verificación de seguridad">
          <div class="join-turnstile-title">Verificación de seguridad</div>
          <div id="joinTurnstile" class="join-turnstile"></div>
        </div>
      </div>
    `;

    const form = document.querySelector('#joinForm');
    const notice = document.querySelector('#notice');
    const otpPanel = document.querySelector('#otpPanel');
    const otpCode = document.querySelector('#otpCode');
    const verifyOtpBtn = document.querySelector('#verifyOtpBtn');
    const resendOtpBtn = document.querySelector('#resendOtpBtn');
    const walletButtons = document.querySelector('#walletButtons');
    const walletHint = document.querySelector('#walletHint');
    const turnstileOverlay = document.querySelector('#joinTurnstileOverlay');
    const turnstileContainer = document.querySelector('#joinTurnstile');
    const phoneInput = document.querySelector('#phone');
    const phonePicker = phoneInput && window.intlTelInput
      ? window.intlTelInput(phoneInput,{initialCountry:'mx',separateDialCode:true,nationalMode:true,autoPlaceholder:'aggressive'})
      : null;

    let photoFile = null;
    let pendingWallet = null;
    let pendingPayload = null;
    let otpEmail = null;
    let otpSending = false;
    let joinCaptchaToken = '';
    let turnstileWidgetId = null;
    let turnstileLoadPromise = null;
    let turnstileReadyPromise = null;
    let captchaRequestPromise = null;
    let captchaResolve = null;
    let captchaReject = null;

    // Cliente de autenticación temporal: verificar un correo no modifica la sesión
    // que el dueño del negocio pueda tener abierta en este mismo navegador.
    const verificationClient = window.supabase.createClient(
      window.ENLA_CONFIG.SUPABASE_URL,
      window.ENLA_CONFIG.SUPABASE_ANON_KEY,
      {
        auth: {
          persistSession: false,
          autoRefreshToken: false,
          detectSessionInUrl: false
        }
      }
    );

    if (isAccess) {
      const photoInput = document.querySelector('#photo');
      const photoPreview = document.querySelector('#photoPreview');

      photoInput.onchange = (e) => {
        photoFile = e.target.files[0] || null;
        if (photoFile) photoPreview.src = URL.createObjectURL(photoFile);
      };
    }

    function showNotice(message, type = 'error') {
      ENLA.msg(notice, message, type);
      notice.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function hideNotice() {
      notice.classList.add('hidden');
    }

    function loadTurnstile() {
      if (window.turnstile) return Promise.resolve(window.turnstile);
      if (turnstileLoadPromise) return turnstileLoadPromise;

      turnstileLoadPromise = new Promise((resolve, reject) => {
        const existing = document.querySelector('script[data-enla-turnstile]');
        if (existing) {
          existing.addEventListener('load', () => resolve(window.turnstile), { once: true });
          existing.addEventListener('error', () => reject(new Error('No se pudo cargar la verificación de seguridad.')), { once: true });
          return;
        }

        const script = document.createElement('script');
        script.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
        script.async = true;
        script.defer = true;
        script.dataset.enlaTurnstile = '1';
        script.onload = () => resolve(window.turnstile);
        script.onerror = () => reject(new Error('No se pudo cargar la verificación de seguridad.'));
        document.head.appendChild(script);
      });

      return turnstileLoadPromise;
    }

    function showTurnstileInteraction() {
      if (!turnstileOverlay) return;
      turnstileOverlay.classList.add('is-active');
      turnstileOverlay.setAttribute('aria-hidden', 'false');
    }

    function hideTurnstileInteraction() {
      if (!turnstileOverlay) return;
      turnstileOverlay.classList.remove('is-active');
      turnstileOverlay.setAttribute('aria-hidden', 'true');
    }

    function clearCaptchaRequest(error = null) {
      if (error && captchaReject) captchaReject(error);
      captchaRequestPromise = null;
      captchaResolve = null;
      captchaReject = null;
    }

    function resetJoinTurnstile() {
      joinCaptchaToken = '';
      hideTurnstileInteraction();
      try {
        if (window.turnstile && turnstileWidgetId !== null) {
          window.turnstile.reset(turnstileWidgetId);
        }
      } catch (_e) {}
      clearCaptchaRequest();
    }

    async function renderJoinTurnstile() {
      if (!visibleWallets.length) return null;
      if (turnstileWidgetId !== null) return turnstileWidgetId;

      const turnstile = await loadTurnstile();
      if (!turnstile || !turnstileContainer) {
        throw new Error('No se pudo iniciar la verificación de seguridad.');
      }

      turnstileWidgetId = turnstile.render(turnstileContainer, {
        sitekey: '0x4AAAAAAFcNEb7pP6lN3sxm',
        theme: 'light',
        language: 'es',
        size: 'flexible',
        appearance: 'interaction-only',
        execution: 'execute',
        action: 'customer_join',
        retry: 'auto',
        'refresh-expired': 'auto',
        'before-interactive-callback': () => {
          showTurnstileInteraction();
        },
        'after-interactive-callback': () => {
          hideTurnstileInteraction();
        },
        callback: (token) => {
          joinCaptchaToken = String(token || '').trim();
          hideTurnstileInteraction();

          if (joinCaptchaToken && captchaResolve) {
            captchaResolve(joinCaptchaToken);
            clearCaptchaRequest();
          }
        },
        'expired-callback': () => {
          joinCaptchaToken = '';
        },
        'timeout-callback': () => {
          joinCaptchaToken = '';
          hideTurnstileInteraction();
          clearCaptchaRequest(new Error('La verificación de seguridad tardó demasiado. Inténtalo nuevamente.'));
        },
        'error-callback': () => {
          joinCaptchaToken = '';
          hideTurnstileInteraction();
          clearCaptchaRequest(new Error('No pudimos completar la verificación de seguridad. Inténtalo nuevamente.'));
        }
      });

      return turnstileWidgetId;
    }

    async function getJoinCaptchaToken() {
      if (joinCaptchaToken) return joinCaptchaToken;

      if (!turnstileReadyPromise) {
        turnstileReadyPromise = renderJoinTurnstile();
      }
      await turnstileReadyPromise;

      if (joinCaptchaToken) return joinCaptchaToken;
      if (captchaRequestPromise) return captchaRequestPromise;

      captchaRequestPromise = new Promise((resolve, reject) => {
        captchaResolve = resolve;
        captchaReject = reject;
      });

      try {
        window.turnstile.execute(turnstileWidgetId);
      } catch (err) {
        clearCaptchaRequest(
          new Error(err?.message || 'No se pudo iniciar la verificación de seguridad.')
        );
        throw err;
      }

      return captchaRequestPromise;
    }

    function getDevice() {
      const ua = navigator.userAgent || '';
      const platform = navigator.userAgentData?.platform || navigator.platform || '';
      const touchMac = /Mac/i.test(platform) && navigator.maxTouchPoints > 1;

      if (/iPhone|iPad|iPod/i.test(ua) || touchMac) return 'ios';
      if (/Android/i.test(ua)) return 'android';
      return 'desktop';
    }

    const appleEnabled = p.apple_enabled !== false;
    const googleEnabled = p.google_enabled !== false;
    const device = getDevice();

    function walletButton(type) {
      if (type === 'apple') {
        return `<button type="button" class="wallet-action wallet-action-apple" data-wallet="apple">
          <span class="wallet-apple-mark"></span>
          <span><small>Agregar a</small><strong>Apple Wallet</strong></span>
        </button>`;
      }
      return `<button type="button" class="wallet-action wallet-action-google" data-wallet="google">
        <span class="wallet-google-mark">G</span>
        <span><small>Agregar a</small><strong>Google Wallet</strong></span>
      </button>`;
    }

    let visibleWallets = [];
    if (device === 'ios') {
      if (appleEnabled) visibleWallets.push('apple');
      else if (googleEnabled) visibleWallets.push('google');
    } else if (device === 'android') {
      if (googleEnabled) visibleWallets.push('google');
      else if (appleEnabled) visibleWallets.push('apple');
    } else {
      if (appleEnabled) visibleWallets.push('apple');
      if (googleEnabled) visibleWallets.push('google');
    }

    if (!visibleWallets.length) {
      walletButtons.innerHTML = `<div class="wallet-unavailable">Este negocio todavía no tiene Wallet habilitado.</div>`;
      walletHint.textContent = '';
    } else {
      walletButtons.innerHTML = visibleWallets.map(walletButton).join('');
      walletHint.textContent =
        device === 'ios'
          ? 'Detectamos un dispositivo Apple.'
          : device === 'android'
            ? 'Detectamos un dispositivo Android.'
            : 'Elige dónde quieres guardar tu tarjeta.';
    }

    turnstileReadyPromise = renderJoinTurnstile().catch((err) => {
      console.error('Turnstile:', err);
      turnstileReadyPromise = null;
      return null;
    });

    function buildBirthDate() {
      const dayEl = document.querySelector('#birthDay');
      const monthEl = document.querySelector('#birthMonth');
      const yearEl = document.querySelector('#birthYear');
      if (!dayEl || !monthEl || !yearEl) return null;
      const day = Number(dayEl.value);
      const month = Number(monthEl.value);
      const year = Number(yearEl.value);

      if (!day || !month || !year) throw new Error('Completa tu fecha de nacimiento.');
      if (year < 1900 || year > currentYear) throw new Error('Escribe un año válido.');

      const dt = new Date(Date.UTC(year, month - 1, day));
      if (
        dt.getUTCFullYear() !== year ||
        dt.getUTCMonth() !== month - 1 ||
        dt.getUTCDate() !== day ||
        dt.getTime() > Date.now()
      ) {
        throw new Error('Escribe una fecha de nacimiento válida.');
      }

      return `${String(year).padStart(4, '0')}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    }

    function validateAndBuildPayload() {
      hideNotice();

      const name = document.querySelector('#name').value.trim();
      const emailInput = document.querySelector('#email');
      const email = emailInput.value.trim().toLowerCase();

      if (name.length < 2) {
        document.querySelector('#name').focus();
        throw new Error('Primero escribe tu nombre.');
      }
      if (!email || !emailInput.checkValidity()) {
        emailInput.focus();
        throw new Error('Primero escribe un correo válido.');
      }
      if (isAccess && !photoFile) {
        document.querySelector('#photo').focus();
        throw new Error('Primero sube tu foto.');
      }

      let phone = null;
      if (phoneInput) {
        try { phone = phonePicker ? phonePicker.getNumber() : phoneInput.value.trim(); } catch (_e) { phone = phoneInput.value.trim(); }
        phone = String(phone || '').trim();
        if (!phone) {
          phoneInput.focus();
          throw new Error('Primero escribe un número de teléfono válido.');
        }
        try {
          if (phonePicker && typeof phonePicker.isValidNumber === 'function' && !phonePicker.isValidNumber()) {
            phoneInput.focus();
            throw new Error('Revisa que el número de teléfono sea válido.');
          }
        } catch (e) {
          if (e instanceof Error && e.message.includes('Revisa')) throw e;
        }
      }
      const birthDate = buildBirthDate();

      return {
        p_program_slug: programSlug,
        p_name: name,
        p_email: email,
        p_phone: phone || null,
        p_photo_url: null,
        p_birth_date: birthDate
      };
    }

    async function uploadPhoto(file) {
      if (!file) return null;

      const ext =
        (file.type || 'image/jpeg').includes('png') ? 'png' :
        (file.type || '').includes('webp') ? 'webp' : 'jpg';

      const rand = crypto.randomUUID
        ? crypto.randomUUID()
        : `${Date.now()}-${Math.random()}`;

      const path = `${programSlug}/${rand}.${ext}`;

      const { error } = await ENLA.sb.storage
        .from('rewards-customer-photos')
        .upload(path, file, {
          upsert: false,
          contentType: file.type || 'image/jpeg'
        });

      if (error) throw error;

      return ENLA.sb.storage
        .from('rewards-customer-photos')
        .getPublicUrl(path).data.publicUrl;
    }

    async function sendVerificationCode(email, captchaToken = null) {
      if (otpSending) return;
      otpSending = true;

      try {
        const token = captchaToken || await getJoinCaptchaToken();
        const { error } = await verificationClient.auth.signInWithOtp({
          email,
          options: {
            shouldCreateUser: true,
            captchaToken: token
          }
        });
        if (error) throw error;

        otpEmail = email;
        otpPanel.classList.remove('hidden');
        document.querySelector('#otpCopy').textContent =
          `Ya existe una tarjeta con ${email}. Te enviamos un código para confirmar que eres tú.`;
        otpCode.value = '';
        setTimeout(() => otpCode.focus(), 100);
        showNotice('Revisa tu correo e ingresa el código de confirmación.', 'success');
      } finally {
        otpSending = false;
        resetJoinTurnstile();
      }
    }

    function isConfirmEmailError(error) {
      return String(error?.message || error || '').includes('CONFIRM_EMAIL');
    }

    async function prepareCustomerWithTurnstile(payload, captchaToken) {
      const response = await fetch(
        `${window.ENLA_CONFIG.SUPABASE_URL}/functions/v1/rewards-join-turnstile`,
        {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            apikey: window.ENLA_CONFIG.SUPABASE_ANON_KEY,
            Authorization: `Bearer ${window.ENLA_CONFIG.SUPABASE_ANON_KEY}`
          },
          body: JSON.stringify({
            captcha_token: captchaToken,
            payload
          })
        }
      );

      const json = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(json.error || 'No se pudo validar el registro.');
      }
      return json;
    }

    async function createOrRecoverCustomer(client, payload) {
      const { data, error } = await client.rpc('rewards_join_program_wallet', payload);
      if (error) throw error;

      const row = data?.[0];
      if (!row?.public_code) throw new Error('No se pudo preparar tu tarjeta.');
      return row.public_code;
    }

    async function openWallet(type, publicCode) {
      if (type === 'apple') {
        location.href =
          `${window.ENLA_CONFIG.SUPABASE_URL}/functions/v1/apple-wallet-pass?c=${encodeURIComponent(publicCode)}`;
        return;
      }

      const response = await fetch(
        `${window.ENLA_CONFIG.SUPABASE_URL}/functions/v1/google-wallet-pass`,
        {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            apikey: window.ENLA_CONFIG.SUPABASE_ANON_KEY,
            Authorization: `Bearer ${window.ENLA_CONFIG.SUPABASE_ANON_KEY}`
          },
          body: JSON.stringify({ public_code: publicCode })
        }
      );

      const json = await response.json();
      if (!response.ok || !json.url) {
        throw new Error(json.error || 'No se pudo preparar Google Wallet.');
      }
      location.href = json.url;
    }

    async function startWalletFlow(type, authenticatedClient = null) {
      const button = document.querySelector(`[data-wallet="${type}"]`);
      const original = button?.innerHTML;

      try {
        const payload = pendingPayload || validateAndBuildPayload();

        if (isAccess && !payload.p_photo_url) {
          payload.p_photo_url = await uploadPhoto(photoFile);
        }

        pendingWallet = type;
        pendingPayload = payload;

        if (button) {
          button.disabled = true;
          button.classList.add('is-loading');
          button.innerHTML = `<span class="wallet-loader"></span><span><small>Preparando</small><strong>Tu tarjeta...</strong></span>`;
        }

        let publicCode = null;

        if (authenticatedClient) {
          // Ya confirmó su correo con OTP; esa verificación vino protegida por Turnstile.
          publicCode = await createOrRecoverCustomer(authenticatedClient, payload);
        } else {
          const captchaToken = await getJoinCaptchaToken();
          const result = await prepareCustomerWithTurnstile(payload, captchaToken);

          if (result?.needs_email_confirmation) {
            if (result?.captcha_consumed) {
              // El primer token ya se consumió en el servidor. Generamos otro
              // automáticamente para que el usuario no tenga que repetir pasos.
              resetJoinTurnstile();
              const otpCaptchaToken = await getJoinCaptchaToken();
              await sendVerificationCode(payload.p_email, otpCaptchaToken);
              return;
            }

            await sendVerificationCode(payload.p_email, captchaToken);
            return;
          }

          publicCode = result?.public_code || null;
          if (!publicCode) throw new Error('No se pudo preparar tu tarjeta.');
          resetJoinTurnstile();
        }

        otpPanel.classList.add('hidden');
        pendingPayload = null;
        pendingWallet = null;

        await openWallet(type, publicCode);
      } catch (err) {
        if (isConfirmEmailError(err) && pendingPayload?.p_email) {
          // Fallback por si el registro cambió entre la validación y el guardado.
          resetJoinTurnstile();
          showNotice('Vuelve a tocar Wallet para continuar con la confirmación de tu correo.');
        } else {
          showNotice(err.message || String(err));
        }
      } finally {
        if (button && original) {
          button.classList.remove('is-loading');
          button.innerHTML = original;
          button.disabled = false;
        }
      }
    }

    walletButtons.addEventListener('click', (event) => {
      const button = event.target.closest('[data-wallet]');
      if (!button) return;

      // Si cambió el formulario después de pedir OTP, volveremos a validar desde cero.
      const currentEmail = document.querySelector('#email').value.trim().toLowerCase();
      if (otpEmail && currentEmail !== otpEmail) {
        otpEmail = null;
        pendingPayload = null;
        otpPanel.classList.add('hidden');
      }

      startWalletFlow(button.dataset.wallet);
    });

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const firstWallet = visibleWallets[0];
      if (firstWallet) startWalletFlow(firstWallet);
    });

    document.querySelector('#email').addEventListener('input', () => {
      const currentEmail = document.querySelector('#email').value.trim().toLowerCase();
      if (otpEmail && currentEmail !== otpEmail) {
        otpEmail = null;
        pendingPayload = null;
        otpPanel.classList.add('hidden');
      }
    });

    verifyOtpBtn.addEventListener('click', async () => {
      hideNotice();

      const token = otpCode.value.replace(/\s+/g, '');
      if (!otpEmail) {
        showNotice('Primero solicita un código de confirmación.');
        return;
      }
      if (token.length < 6) {
        otpCode.focus();
        showNotice('Escribe el código completo que llegó a tu correo.');
        return;
      }

      const original = verifyOtpBtn.textContent;
      verifyOtpBtn.disabled = true;
      verifyOtpBtn.textContent = 'Confirmando...';

      try {
        const { error } = await verificationClient.auth.verifyOtp({
          email: otpEmail,
          token,
          type: 'email'
        });
        if (error) throw error;

        showNotice('Correo confirmado. Preparando tu tarjeta...', 'success');

        if (!pendingWallet || !pendingPayload) {
          throw new Error('Vuelve a tocar el botón de Wallet para continuar.');
        }

        await startWalletFlow(pendingWallet, verificationClient);
      } catch (err) {
        showNotice(
          /expired|invalid|token/i.test(String(err?.message || err))
            ? 'El código no es válido o ya venció. Inténtalo de nuevo.'
            : (err.message || String(err))
        );
      } finally {
        verifyOtpBtn.disabled = false;
        verifyOtpBtn.textContent = original;
      }
    });

    resendOtpBtn.addEventListener('click', async () => {
      if (!otpEmail) {
        showNotice('Primero escribe tu correo y toca Agregar a Wallet.');
        return;
      }

      resendOtpBtn.disabled = true;
      const original = resendOtpBtn.textContent;
      resendOtpBtn.textContent = 'Enviando...';

      try {
        await sendVerificationCode(otpEmail);
      } catch (err) {
        showNotice(err.message || String(err));
      } finally {
        resendOtpBtn.disabled = false;
        resendOtpBtn.textContent = original;
      }
    });

  } catch (e) {
    box.innerHTML = `<div class="error">${e.message}</div>`;
  }
})();
</script>
</body>
</html>
