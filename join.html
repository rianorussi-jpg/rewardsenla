<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Únete a Rewards</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/app/assets/app.css?v=20260906-access1"></head><body><main class="public-shell"><div class="public-wrap"><div class="public-brand">rewards.<span>enla</span></div><section class="join-card" id="box"><p class="muted" style="text-align:center">Cargando programa...</p></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/app/assets/config.js?v=20260906-access1"></script><script src="/app/assets/app.js?v=20260906-access1"></script><script>(async()=>{const box=document.querySelector('#box');try{ENLA.ensureConfigured();const programSlug=new URLSearchParams(location.search).get('p');if(!programSlug)throw new Error('Falta la tarjeta en este enlace.');const {data,error}=await ENLA.sb.rpc('rewards_public_program_card',{p_program_slug:programSlug});if(error)throw error;const p=data?.[0];if(!p)throw new Error('Este programa no existe o todavía no está activo.');const isAccess=p.program_type==='access';const detail=p.program_type==='cashback'?'💵 Acumula saldo en pesos y úsalo en el negocio':p.program_type==='visits'?`🎟️ Incluye ${p.goal_count} visitas.`:isAccess?`🪪 ${p.service_name||p.program_name} · Vigencia inicial: ${p.validity_days||30} días`:`🎁 ${p.reward_text} · Meta: ${p.goal_count} sellos`;const promoImage=p.program_type!=='stamps'&&p.central_image_url&&p.card_style==='promo'?`<img class="customer-promo-image" src="${p.central_image_url}" alt="Promoción">`:'';box.innerHTML=`<div class="join-head">${p.logo_url?`<img class="join-logo" src="${p.logo_url}" alt="Logo">`:''}<h1>${p.display_name||p.business_name}</h1><p class="muted">${p.program_name}</p></div><div class="join-promo" style="border-left:4px solid ${p.primary_color}"><b>${p.promo_text||'Regístrate para obtener tu tarjeta digital'}</b><div class="small muted" style="margin-top:5px">${detail}</div></div>${promoImage}<form id="joinForm" class="form-grid"><div class="field"><label>Tu nombre</label><input id="name" required autocomplete="name"></div>${isAccess?`<div class="field"><label>Tu foto</label><div class="customer-photo-upload"><img id="photoPreview" class="customer-photo-preview" alt="Tu foto"><div><input id="photo" type="file" accept="image/png,image/jpeg,image/webp" capture="user" required><div class="small muted" style="margin-top:5px">Se usará para que el negocio confirme tu identidad al escanear.</div></div></div></div>`:''}<div class="field"><label>Correo</label><input id="email" type="email" autocomplete="email" placeholder="tu@correo.com"></div><div class="field"><label>Teléfono</label><input id="phone" type="tel" autocomplete="tel" placeholder="Opcional si agregas correo"></div><button class="btn btn-primary" style="background:${p.primary_color}">Crear mi tarjeta</button><div id="notice" class="hidden"></div></form>`;let photoFile=null;if(isAccess){const pi=document.querySelector('#photo'),pv=document.querySelector('#photoPreview');pi.onchange=e=>{photoFile=e.target.files[0]||null;if(photoFile)pv.src=URL.createObjectURL(photoFile)}}async function uploadPhoto(file){if(!file)return null;const ext=(file.type||'image/jpeg').includes('png')?'png':(file.type||'').includes('webp')?'webp':'jpg';const rand=crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`;const path=`${programSlug}/${rand}.${ext}`;const {error}=await ENLA.sb.storage.from('rewards-customer-photos').upload(path,file,{upsert:false,contentType:file.type||'image/jpeg'});if(error)throw error;return ENLA.sb.storage.from('rewards-customer-photos').getPublicUrl(path).data.publicUrl}document.querySelector('#joinForm').onsubmit=async e=>{e.preventDefault();const n=document.querySelector('#notice');n.classList.add('hidden');try{let photoUrl=null;if(isAccess){if(!photoFile)throw new Error('Sube tu foto para continuar.');photoUrl=await uploadPhoto(photoFile)}const {data,error}=await ENLA.sb.rpc('rewards_join_program_card',{p_program_slug:programSlug,p_name:document.querySelector('#name').value,p_email:document.querySelector('#email').value||null,p_phone:document.querySelector('#phone').value||null,p_photo_url:photoUrl});if(error)throw error;location.href='/card.html?c='+encodeURIComponent(data[0].public_code)}catch(err){ENLA.msg(n,err.message)}}}catch(e){box.innerHTML=`<div class="error">${e.message}</div>`}})();</script></body></html>
