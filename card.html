<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi tarjeta Rewards</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/app/assets/app.css?v=20260906-visits2"></head><body><main class="public-shell"><div class="public-wrap"><div class="public-brand">rewards.<span>enla</span></div><div id="box"><div class="card muted" style="text-align:center">Cargando tu tarjeta...</div></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script src="/app/assets/config.js?v=20260906-visits2"></script><script src="/app/assets/app.js?v=20260906-visits2"></script><script>(async()=>{const box=document.querySelector('#box');try{ENLA.ensureConfigured();const code=(new URLSearchParams(location.search).get('c')||'').toUpperCase();if(!code)throw new Error('Falta el código de la tarjeta.');const {data,error}=await ENLA.sb.rpc('rewards_public_card',{p_code:code});if(error)throw error;const c=data?.[0];if(!c)throw new Error('No encontramos esta tarjeta.');const goal=Number(c.goal_count||6),current=Number(c.current_value||0),type=c.program_type||'stamps',m=ENLA.loyaltyMeta(type),inactive=c.customer_status==='inactive';let progress='';if(type==='stamps'){let stamps='';for(let i=0;i<Math.min(goal,30);i++){const on=i<current;const img=on?c.stamp_filled_image_url:c.stamp_empty_image_url;if(img)stamps+=`<span class="stamp ${on?'on':''}"><img src="${img}" alt=""></span>`;else stamps+=`<span class="stamp ${on?'on':''}">${on?(c.stamp_icon||'⭐'):'○'}</span>`;}progress=`<div class="stamps">${stamps}</div>`}else if(type==='cashback'){progress=`<div class="cashback-balance"><small>SALDO</small><strong>$${current.toFixed(2)}</strong></div>`}else{progress=`<div class="visit-remaining"><strong>${current}</strong><span>visitas restantes de ${goal}</span></div>${inactive?'<div class="badge red" style="margin-top:12px">Tarjeta inactiva</div>':''}`}const bg=c.card_style==='classic'?(c.primary_color||'#4b63f3'):`linear-gradient(145deg,${c.primary_color||'#4b63f3'},${c.secondary_color||c.primary_color||'#7457f7'})`;const promoImage=type!=='stamps'&&c.central_image_url&&c.card_style==='promo'?`<img class="customer-promo-image" src="${c.central_image_url}" alt="Promoción">`:'';const lower=type==='cashback'?`<div class="reward-line">💵 Usa tu saldo en tus compras en ${c.display_name||c.business_name}</div>`:type==='visits'?`<div class="reward-line">🎟️ Este pase incluye ${goal} visitas por ciclo. Cada acceso descuenta 1.</div>`:`<div class="reward-line">🎁 ${c.reward_text}</div>`;box.innerHTML=`<section class="customer-pass ${inactive?'visit-status-inactive':''}" style="background:${bg}"><div class="pass-top"><div>${c.logo_url?`<img class="logo-preview" src="${c.logo_url}" alt="Logo">`:`<b>${c.display_name||c.business_name}</b>`}</div><span class="program-type-pill">${type==='visits'?'VISITAS':m.plural}</span></div>${promoImage}<h2 style="margin:20px 0 4px">${c.program_name}</h2><div style="opacity:.85;font-size:13px">${c.promo_text||''}</div>${progress}${lower}<div class="qr-white"><div id="customerQR"></div></div><div style="text-align:center;font-size:12px;letter-spacing:.12em">${c.public_code}</div></section><p class="muted small" style="text-align:center;margin-top:16px">${type==='cashback'?'Muestra este QR para recibir cashback o usar tu saldo.':type==='visits'?'Muestra este QR para registrar el uso de una visita.':'Muestra este QR en el negocio para sumar sellos.'}</p><div class="grid grid-2">${c.apple_enabled!==false?`<button class="btn btn-secondary" id="appleWalletBtn"> Agregar a Apple Wallet</button>`:''}${c.google_enabled!==false?`<button class="btn btn-primary" id="googleWalletBtn">Agregar a Google Wallet</button>`:''}</div><div id="walletNotice" class="hidden" style="margin-top:10px"></div>`;new QRCode(document.querySelector('#customerQR'),{text:c.public_code,width:190,height:190});const aw=document.querySelector('#appleWalletBtn');if(aw)aw.onclick=()=>{aw.disabled=true;aw.textContent='Preparando Apple Wallet...';location.href=`${window.ENLA_CONFIG.SUPABASE_URL}/functions/v1/apple-wallet-pass?c=${encodeURIComponent(c.public_code)}`;setTimeout(()=>{aw.disabled=false;aw.textContent=' Agregar a Apple Wallet'},2500)};const gw=document.querySelector('#googleWalletBtn');if(gw)gw.onclick=async()=>{const notice=document.querySelector('#walletNotice');gw.disabled=true;gw.textContent='Preparando Google Wallet...';try{const r=await fetch(`${window.ENLA_CONFIG.SUPABASE_URL}/functions/v1/google-wallet-pass`,{method:'POST',headers:{'Content-Type':'application/json','apikey':window.ENLA_CONFIG.SUPABASE_ANON_KEY,'Authorization':`Bearer ${window.ENLA_CONFIG.SUPABASE_ANON_KEY}`},body:JSON.stringify({public_code:c.public_code})});const j=await r.json();if(!r.ok||!j.url)throw new Error(j.error||'No se pudo generar el pase.');location.href=j.url}catch(e){ENLA.msg(notice,e.message,'error');gw.disabled=false;gw.textContent='Agregar a Google Wallet'}}}catch(e){box.innerHTML=`<div class="error">${e.message}</div>`}})();</script></body></html>
