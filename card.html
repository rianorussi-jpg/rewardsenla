<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi tarjeta Rewards</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/app/assets/app.css"></head><body><main class="public-shell"><div class="public-wrap"><div class="public-brand">rewards.<span>enla</span></div><div id="box"><div class="card muted" style="text-align:center">Cargando tu tarjeta...</div></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script src="/app/assets/config.js?v=20260906-qr1"></script><script src="/app/assets/app.js?v=20260906-qr1"></script><script>(async()=>{const box=document.querySelector('#box');try{ENLA.ensureConfigured();const code=(new URLSearchParams(location.search).get('c')||'').toUpperCase();if(!code)throw new Error('Falta el código de la tarjeta.');const {data,error}=await ENLA.sb.rpc('rewards_public_card',{p_code:code});if(error)throw error;const c=data?.[0];if(!c)throw new Error('No encontramos esta tarjeta.');const goal=c.goal_count||6,val=Number(c.current_value||0);let stamps='';if(c.program_type==='stamps'){for(let i=0;i<Math.min(goal,30);i++)stamps+=`<span class="stamp ${i<val?'on':''}">${i<val?(c.stamp_icon||'⭐'):'○'}</span>`}box.innerHTML=`<section class="customer-pass" style="background:${c.primary_color||'#4b63f3'}"><div class="pass-top"><div>${c.logo_url?`<img class="logo-preview" src="${c.logo_url}" alt="Logo">`:`<b>${c.display_name||c.business_name}</b>`}</div><span class="small">rewards.enla</span></div><h2 style="margin:20px 0 4px">${c.customer_name}</h2><div style="opacity:.85;font-size:13px">${c.program_name}</div>${c.program_type==='points'?`<div style="font-size:46px;font-weight:900;margin:22px 0 4px">${val}<span style="font-size:15px"> pts</span></div>`:`<div class="stamps">${stamps}</div>`}<div class="reward-line">🎁 ${c.reward_text}</div><div class="qr-white"><div id="customerQR"></div></div><div style="text-align:center;font-size:12px;letter-spacing:.12em">${c.public_code}</div></section><p class="muted small" style="text-align:center;margin-top:16px">Muestra este QR en el negocio para sumar tus recompensas.</p><div class="grid grid-2"><button class="btn btn-secondary" disabled> Apple Wallet · próximamente</button><button class="btn btn-secondary" disabled>Google Wallet · próximamente</button></div>`;new QRCode(document.querySelector('#customerQR'),{text:c.public_code,width:190,height:190})}catch(e){box.innerHTML=`<div class="error">${e.message}</div>`}})();</script></body></html>
