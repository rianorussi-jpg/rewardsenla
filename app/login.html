<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iniciar sesión — rewards.enla</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/app/assets/app.css"></head><body><div class="auth-shell"><section class="auth-side"><a class="auth-brand" href="/">rewards.<span>enla</span></a><div class="auth-copy"><h1>Bienvenido de vuelta.</h1><p>Administra clientes, sellos, recompensas y el diseño de tu programa desde un solo lugar.</p><div class="auth-preview"><span class="chip">🎨 Colores y logo</span><span class="chip">⭐ Sellos personalizados</span><span class="chip">🎁 Promociones</span><span class="chip">📱 Wallet</span></div></div></section><main class="auth-main"><form class="auth-card" id="form"><h2>Iniciar sesión</h2><p class="muted">Accede al panel de tu negocio.</p><div id="notice" class="hidden"></div><div class="form-grid"><div class="field"><label>Correo</label><input id="email" type="email" required placeholder="tu@negocio.com"></div><div class="field"><label>Contraseña</label><input id="password" type="password" required></div><button class="btn btn-primary" type="submit">Entrar</button><p class="small muted" style="text-align:center">¿No tienes cuenta? <a href="/app/register.html" style="color:#4356d9;font-weight:800">Crea una</a></p></div></form></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/app/assets/config.js"></script><script src="/app/assets/app.js"></script><script>const f=document.querySelector('#form'),n=document.querySelector('#notice');f.onsubmit=async e=>{e.preventDefault();try{const email=document.querySelector('#email').value.trim(),password=document.querySelector('#password').value;if(!ENLA.configured){const d=ENLA.demoStore();d.user={id:'demo-user',email};d.business=d.business||{id:'demo-business',name:'Mi negocio',owner_id:'demo-user'};ENLA.saveDemo(d);location.href='/app/dashboard.html';return}const {error}=await ENLA.sb.auth.signInWithPassword({email,password});if(error)throw error;location.href='/app/dashboard.html'}catch(err){ENLA.msg(n,err.message)}};</script></body></html>
