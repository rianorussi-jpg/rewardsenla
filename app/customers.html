</nav><div class="side-bottom"><button class="btn btn-secondary" id="signOut" style="width:100%">Cerrar sesión</button></div></aside><div class="overlay"></div><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="btn btn-secondary mobile-menu" id="mobileMenu">☰</button><h1>Clientes</h1></div><a class="btn btn-primary btn-sm" href="/app/program.html">Editar tarjeta</a></header><div class="content"><div class="section-title" style="margin-top:0"><div><h2>Clientes</h2><p class="muted small">Consulta el progreso y agrega movimientos manualmente.</p></div><button class="btn btn-primary" id="addCustomer">+ Nuevo cliente</button></div><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Cliente</th><th>Contacto</th><th>Progreso</th><th>Estado</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="5" class="muted">Cargando...</td></tr></tbody></table></div></div><dialog id="modal" style="border:0;border-radius:20px;padding:0;box-shadow:0 30px 90px rgba(16,24,40,.25);width:min(460px,calc(100% - 30px))"><form method="dialog" class="card" style="border:0"><h2 style="margin-top:0">Nuevo cliente</h2><div class="form-grid"><div class="field"><label>Nombre</label><input id="cname" required></div><div class="field"><label>Correo (opcional)</label><input id="cemail" type="email"></div><div class="field"><label>Teléfono (opcional)</label><input id="cphone"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-secondary" value="cancel">Cancelar</button><button class="btn btn-primary" id="saveCustomer" value="default">Guardar</button></div></div></form></dialog></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/app/assets/config.js"></script><script src="/app/assets/app.js"></script><script>ENLA.bindShell();ENLA.navActive();(async()=>{await ENLA.requireAuth();const rows=document.querySelector('#rows'),modal=document.querySelector('#modal');document.querySelector('#addCustomer').onclick=()=>modal.showModal();async function load(){if(!ENLA.sb){const d=ENLA.demoStore();const cs=d.customers||[];rows.innerHTML=cs.length?cs.map(c=>`<tr><td><div class="person"><div class="avatar">${ENLA.initials(c.name)}</div><b>${c.name}</b></div></td><td>${c.email||c.phone||'—'}</td><td>${c.stamps||0} sellos</td><td><span class="badge green">Activo</span></td><td><button class="btn btn-secondary btn-sm" onclick="addStamp('${c.id}')">+ sello</button></td></tr>`).join(''):'<tr><td colspan="5" class="muted">Aún no tienes clientes.</td></tr>';return}const b=await ENLA.getBusiness();const {data,error}=await ENLA.sb.from('rewards_customers').select('*').eq('business_id',b.id).order('created_at',{ascending:false});if(error)throw error;rows.innerHTML=data.length?data.map(c=>`<tr><td><div class="person"><div class="avatar">${ENLA.initials(c.name)}</div><b>${c.name}</b></div></td><td>${c.email||c.phone||'—'}</td><td>${c.current_value||0}</td><td><span class="badge green">Activo</span></td><td><button class="btn btn-secondary btn-sm" onclick="addStamp('${c.id}')">+ sello</button></td></tr>`).join(''):'<tr><td colspan="5" class="muted">Aún no tienes clientes.</td></tr>'}document.querySelector('#saveCustomer').onclick=async e=>{e.preventDefault();const name=document.querySelector('#cname').value.trim();if(!name)return;if(!ENLA.sb){const d=ENLA.demoStore();d.customers=d.customers||[];d.customers.push({id:'c'+Date.now(),name,email:document.querySelector('#cemail').value,phone:document.querySelector('#cphone').value,stamps:0});ENLA.saveDemo(d)}else{const b=await ENLA.getBusiness();const p=await ENLA.getProgram();const {error}=await ENLA.sb.from('rewards_customers').insert({business_id:b.id,program_id:p?.id,name,email:document.querySelector('#cemail').value||null,phone:document.querySelector('#cphone').value||null,current_value:0});if(error)throw error}modal.close();load()};window.addStamp=async id=>{if(!ENLA.sb){const d=ENLA.demoStore();const c=(d.customers||[]).find(x=>x.id===id);if(c)c.stamps=(c.stamps||0)+1;ENLA.saveDemo(d);return load()}const b=await ENLA.getBusiness();const {data:c}=await ENLA.sb.from('rewards_customers').select('*').eq('id',id).single();await ENLA.sb.from('rewards_customers').update({current_value:(c.current_value||0)+1}).eq('id',id);await ENLA.sb.from('rewards_loyalty_transactions').insert({business_id:b.id,program_id:c.program_id,customer_id:id,type:'stamp',amount:1});load()};await load();})();</script></body></html>
