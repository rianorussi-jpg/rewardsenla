<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Empleados — rewards.enla</title><link rel="stylesheet" href="/app/assets/app.css?v=20260907-publish2"></head><body><div class="app-shell"><aside class="sidebar"><a class="side-brand" href="/">rewards.<span>enla</span></a><nav class="nav-list"></nav><div class="side-bottom"><button class="btn btn-secondary" id="signOut" style="width:100%">Cerrar sesión</button></div></aside><div class="overlay"></div><main class="main"><header class="topbar"><div><h1>Empleados de la tarjeta</h1><div class="topbar-sub" id="programName"></div></div><a class="btn btn-secondary btn-sm" id="back">← Volver</a></header><div class="content"><div class="card staff-hero"><div><span class="badge blue">Acceso limitado</span><h2>Personal que puede escanear</h2><p class="muted">Cada empleado solo puede operar esta tarjeta: escanear y registrar sellos, cashback, visitas o accesos. No puede editar clientes, saldos, configuración ni vencimientos.</p></div><div class="staff-invite"><input id="email" type="email" placeholder="empleado@negocio.com"><button class="btn btn-primary" id="invite">Agregar empleado</button></div></div><div class="section-title"><h2>Accesos</h2></div><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Empleado</th><th>Estado</th><th>Acción</th></tr></thead><tbody id="rows"></tbody></table></div></div></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/app/assets/config.js?v=20260907-publish2"></script><script src="/app/assets/app.js?v=20260907-publish2"></script><script>ENLA.bindShell();(async()=>{await ENLA.requireAuth();const id=new URLSearchParams(location.search).get('program');const p=await ENLA.getProgram(id);if(!p)throw new Error('Tarjeta no encontrada');document.querySelector('#programName').textContent=p.program_name;document.querySelector('#back').href='/app/card-detail.html?id='+id;async function load(){const {data,error}=await ENLA.sb.from('rewards_program_staff').select('*').eq('program_id',id).order('created_at');if(error)throw error;document.querySelector('#rows').innerHTML=(data||[]).map(x=>`<tr><td><b>${x.email}</b></td><td><span class="badge ${x.status==='active'?'green':'red'}">${x.status==='active'?'Activo':'Suspendido'}</span></td><td><button class="btn btn-secondary btn-sm" onclick="toggleStaff('${x.id}','${x.status==='active'?'inactive':'active'}')">${x.status==='active'?'Suspender':'Reactivar'}</button></td></tr>`).join('')||'<tr><td colspan="3" class="muted">Aún no agregas empleados.</td></tr>'}window.toggleStaff=async(id,status)=>{const {error}=await ENLA.sb.from('rewards_program_staff').update({status}).eq('id',id);if(error)alert(error.message);else load()};document.querySelector('#invite').onclick=async()=>{const email=document.querySelector('#email').value.trim();if(!email)return;const {error}=await ENLA.sb.rpc('rewards_add_program_staff',{p_program_id:id,p_email:email});if(error)alert(error.message);else{document.querySelector('#email').value='';load()}};load()})().catch(e=>alert(e.message));</script></body></html>
