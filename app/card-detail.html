<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/png" href="/assets/favicon.png"><link rel="apple-touch-icon" href="/assets/favicon.png"><title>Tarjeta — enla.cards</title><link rel="stylesheet" href="/app/assets/app.css?v=20260927-detail-preview2"></head><body><div class="app-shell"><aside class="sidebar"><a class="side-brand" href="/">enla.<span>cards</span></a><nav class="nav-list">
<a class="nav-item" href="/app/dashboard.html">▦ Mis tarjetas</a>
<a class="nav-item" href="/app/customers.html">♙ Clientes</a>
<a class="nav-item" href="/app/scan.html">⌗ Escanear</a>
<a class="nav-item" href="/app/history.html">◴ Historial</a>
<a class="nav-item" href="/app/settings.html">⚙ Ajustes</a></nav><div class="side-bottom"><button class="btn btn-secondary" id="signOut" style="width:100%">Cerrar sesión</button></div></aside><div class="overlay"></div><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="btn btn-secondary mobile-menu" id="mobileMenu">☰</button><h1>Detalle de tarjeta</h1></div><a class="btn btn-secondary btn-sm" href="/app/dashboard.html">← Mis tarjetas</a></header><div class="content"><div id="hero"></div><div id="shareCard"></div><div class="grid grid-4" style="margin-top:18px"><div class="card metric"><div class="label">Clientes</div><div class="value" id="clients">0</div></div><div class="card metric"><div class="label">Movimientos</div><div class="value" id="moves">0</div></div><div class="card metric"><div class="label">Canjes / usos</div><div class="value" id="redeems">0</div></div><div class="card metric"><div class="label">Actividad 30 días</div><div class="value" id="month">0</div></div></div><div class="section-title"><h2>Actividad reciente</h2></div><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Cliente</th><th>Movimiento</th><th>Fecha</th></tr></thead><tbody id="activity"></tbody></table></div></div></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script src="/app/assets/config.js?v=20260907-publish2"></script><script src="/app/assets/app.js?v=20260927-card-summary"></script><script>ENLA.bindShell();(async()=>{try{await ENLA.requireAuth();const id=new URLSearchParams(location.search).get('id');if(!id)throw new Error('Falta la tarjeta.');const p=await ENLA.getProgram(id);if(!p)throw new Error('No se encontró esta tarjeta.');const type=p.program_type==='cashback'?'Cashback':p.program_type==='visits'?'Visitas':p.program_type==='access'?'Identificación / Acceso':'Sellos';document.querySelector('#hero').innerHTML=`<div class="detail-hero" style="background:${p.primary_color||'#4b63f3'};color:${p.text_color||'#ffffff'}"><div style="display:flex;align-items:center;gap:16px">${p.logo_url?`<img class="detail-hero-logo" src="${p.logo_url}">`:''}<div><span class="badge">${type}</span><h2 style="margin:8px 0 4px">${p.program_name}</h2><div style="opacity:.8">${p.display_name||''}</div></div></div><div class="detail-actions"><span class="badge ${p.publication_status==='published'?'blue':''}">${p.publication_status==='published'?'Publicada':'Borrador'}</span>${p.publication_status==='published'?`<button class="btn btn-secondary btn-sm" id="publicationBtn">Apagar tarjeta</button>`:`<button class="btn btn-primary btn-sm" id="publicationBtn">Publicar tarjeta</button>`}<a class="btn btn-secondary btn-sm" href="/app/program.html?id=${p.id}">Personalizar tarjeta</a><a class="btn btn-secondary btn-sm" href="/app/customers.html?program=${p.id}">Clientes y QR</a><a class="btn btn-secondary btn-sm" href="/app/scan.html?program=${p.id}">Escanear</a><a class="btn btn-secondary btn-sm" href="/app/staff.html?program=${p.id}">Empleados</a><a class="btn btn-secondary btn-sm" href="/app/notifications.html?program=${p.id}">Notificaciones</a></div></div>`;
const joinUrl=ENLA.publicJoinUrl(p);
const previewColor=p.primary_color||'#4b63f3';
const previewText=p.text_color||'#ffffff';
const promo=String(p.promo_text||'').trim();
const barcodeFormat=p.barcode_format||'qr';
const goal=Math.min(10,Math.max(2,Number(p.goal_count||6)));
const stampIcon=p.stamp_icon||'⭐';
const filledStamp=p.stamp_filled_image_url
  ? `<img src="${p.stamp_filled_image_url}" alt="">`
  : stampIcon;
const emptyStamp=p.stamp_empty_image_url
  ? `<img src="${p.stamp_empty_image_url}" alt="">`
  : filledStamp;
const isStamp=p.program_type==='stamps';
const isVisits=p.program_type==='visits';
const isAccess=p.program_type==='access';
const isCashback=p.program_type==='cashback';
const hasMedia=!isStamp&&Boolean(p.central_image_url);

const headerHtml=isStamp
  ? `<small>SELLOS</small><strong>2 / ${goal}</strong>`
  : isVisits
    ? `<small>VISITAS RESTANTES</small><strong>6</strong>`
    : isAccess
      ? `<small>VENCIMIENTO</small><strong>06 OCT 2026</strong>`
      : `<small>SALDO</small><strong>$40.00</strong>`;

const progressHtml=isStamp
  ? `<div class="wallet-field-label">TUS SELLOS</div>
     <div class="stamps wallet-stamps ${goal<=5?'single-row':'two-rows'}">
       ${Array.from({length:goal},(_,i)=>`<span class="stamp ${i<2?'on':'off'} ${i>=2&&p.stamp_empty_image_url?'custom-empty':''}">${i<2?filledStamp:emptyStamp}</span>`).join('')}
     </div>`
  : '';

const fieldsHtml=isStamp
  ? `<div><small>RECOMPENSA</small><b>${p.reward_text||'Tu recompensa'}</b></div>`
  : isVisits
    ? `<div><small>PAQUETE</small><b>${p.goal_count||8} visitas incluidas</b></div><div><small>CLIENTE</small><b>Cliente de ejemplo</b></div>`
    : isAccess
      ? `<div><small>SERVICIO</small><b>${p.service_name||p.program_name||'Membresía'}</b></div><div><small>CLIENTE</small><b>Cliente de ejemplo</b></div>`
      : '';

const codeHtml=barcodeFormat==='code128'
  ? '<div class="wallet-barcode-demo" aria-hidden="true"></div><small>CÓDIGO DE CLIENTE</small>'
  : '<div class="wallet-qr-demo" aria-hidden="true"></div><small>ESCANEA PARA IDENTIFICARTE</small>';

document.querySelector('#shareCard').innerHTML=`
  <section class="card detail-share-panel">
    <div class="detail-preview-column">
      <div class="detail-section-head">
        <span class="badge blue">Vista previa</span>
        <h2>Así se ve tu tarjeta</h2>
        <p class="muted">La misma vista previa que utilizas al personalizarla.</p>
      </div>

      <div class="wallet-preview wallet-preview-real detail-wallet-preview">
        <div class="wallet-preview-head">
          <div>
            <b>Vista previa en Apple Wallet</b>
            <span>Simulación · iPhone</span>
          </div>
          <span class="wallet-preview-badge">APPLE WALLET</span>
        </div>

        <div class="pass-card apple-pass-preview ${isStamp&&goal<=5?'stamps-single-row':''}" style="background:${previewColor};color:${previewText}">
          <div class="pass-top apple-pass-top">
            <div class="preview-brand">
              ${p.logo_url
                ? `<img class="logo-preview" src="${p.logo_url}" alt="">`
                : `<div class="wallet-logo-text">${String(p.display_name||'MI NEGOCIO').toUpperCase()}</div>`}
            </div>
            <div class="wallet-header-field">${headerHtml}</div>
          </div>

          ${hasMedia
            ? `<div class="preview-media apple-strip"><img src="${p.central_image_url}" alt=""></div>`
            : ''}

          ${promo
            ? `<div aria-label="Texto promocional" class="wallet-promo-preview">${promo}</div>`
            : ''}

          <div class="wallet-primary-content">${progressHtml}</div>
          <div class="wallet-field-row">${fieldsHtml}</div>
          <div class="reward-line wallet-reward"></div>
          <div class="wallet-code-area">${codeHtml}</div>
        </div>
      </div>
    </div>

    <div class="detail-share-column">
      <div class="detail-section-head">
        <span class="badge">Compartir con clientes</span>
        <h2>Registro de la tarjeta</h2>
        <p class="muted">Comparte este QR o el enlace corto para que tus clientes se registren.</p>
      </div>

      <div class="detail-qr-box">
        <div class="card-share-qr" id="joinQR"></div>
        <div class="detail-link-label">ENLACE DE REGISTRO</div>
        <a class="card-share-link" id="joinUrl" href="${joinUrl}" target="_blank" rel="noopener">${joinUrl}</a>
        <div class="card-share-actions">
          <button class="btn btn-secondary" id="copyJoin">Copiar enlace</button>
          <a class="btn btn-primary" href="${joinUrl}" target="_blank" rel="noopener">Abrir registro ↗</a>
        </div>
        <div class="small muted" id="copyJoinStatus"></div>
      </div>
    </div>
  </section>`;

if(typeof QRCode==='function'){
  const qrHost=document.querySelector('#joinQR');
  qrHost.innerHTML='';
  new QRCode(qrHost,{
    text:joinUrl,
    width:180,
    height:180,
    colorDark:'#122f4d',
    colorLight:'#ffffff',
    correctLevel:QRCode.CorrectLevel.M
  });
  // qrcodejs crea canvas + img. En navegadores modernos usamos solo el canvas.
  const qrCanvas=qrHost.querySelector('canvas');
  const qrImg=qrHost.querySelector('img');
  if(qrCanvas)qrCanvas.style.display='block';
  if(qrImg)qrImg.style.display='none';
}

document.querySelector('#copyJoin').onclick=async()=>{
  try{
    await navigator.clipboard.writeText(joinUrl);
    document.querySelector('#copyJoinStatus').textContent='Enlace copiado.';
  }catch(_e){
    document.querySelector('#copyJoinStatus').textContent='No se pudo copiar automáticamente. Selecciona el enlace.';
  }
};
const publicationBtn=document.querySelector('#publicationBtn');if(publicationBtn){publicationBtn.onclick=async()=>{publicationBtn.disabled=true;try{if(p.publication_status==='published'){if(!confirm('¿Apagar esta tarjeta? Volverá a borrador y liberará un espacio de publicación.')){publicationBtn.disabled=false;return}await ENLA.unpublishProgram(p.id);location.reload()}else{const r=await ENLA.smartPublish(p.id);if(r.published)location.reload()}}catch(err){alert(err.message);publicationBtn.disabled=false}}}const {data:customers,count}=await ENLA.sb.from('rewards_customers').select('*',{count:'exact'}).eq('program_id',id);const {data:tx}=await ENLA.sb.from('rewards_loyalty_transactions').select('type,amount,created_at,rewards_customers(name)').eq('program_id',id).order('created_at',{ascending:false});document.querySelector('#clients').textContent=count||0;document.querySelector('#moves').textContent=(tx||[]).length;document.querySelector('#redeems').textContent=(tx||[]).filter(x=>x.type==='redeem'||x.type==='spend'||x.type==='access_in'||x.type==='access_entry').length;const cutoff=Date.now()-30*86400000;document.querySelector('#month').textContent=(tx||[]).filter(x=>new Date(x.created_at).getTime()>=cutoff).length;document.querySelector('#activity').innerHTML=(tx||[]).slice(0,10).map(x=>`<tr><td>${x.rewards_customers?.name||'Cliente'}</td><td>${x.type==='spend'?'Saldo usado':x.type==='cashback'?'Cashback':x.type==='visit_use'?'Visita usada':x.type==='visit_renew'?'Paquete renovado':x.type==='deactivate'?'Tarjeta desactivada':x.type==='access_in'?'Entrada':x.type==='access_out'?'Salida':x.type==='access_entry'?'Acceso':x.type==='access_renew'?'Vigencia renovada':x.type==='visit'?'Visita':x.type==='redeem'?'Canje':'Sello'}</td><td>${new Date(x.created_at).toLocaleString('es-MX')}</td></tr>`).join('')||'<tr><td colspan="3" class="muted">Sin actividad todavía.</td></tr>';}catch(e){document.querySelector('.content').innerHTML=`<div class="error">${e.message}</div>`}})();</script></body></html>
