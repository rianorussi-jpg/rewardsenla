<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tarjeta — rewards.enla</title><link rel="stylesheet" href="/app/assets/app.css?v=20260906-stafffix3"></head><body><div class="app-shell"><aside class="sidebar"><a class="side-brand" href="/">rewards.<span>enla</span></a><nav class="nav-list">
<a class="nav-item" href="/app/dashboard.html">▦ Mis tarjetas</a>
<a class="nav-item" href="/app/customers.html">♙ Clientes</a>
<a class="nav-item" href="/app/scan.html">⌗ Escanear</a>
<a class="nav-item" href="/app/history.html">◴ Historial</a>
<a class="nav-item" href="/app/settings.html">⚙ Ajustes</a></nav><div class="side-bottom"><button class="btn btn-secondary" id="signOut" style="width:100%">Cerrar sesión</button></div></aside><div class="overlay"></div><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="btn btn-secondary mobile-menu" id="mobileMenu">☰</button><h1>Detalle de tarjeta</h1></div><a class="btn btn-secondary btn-sm" href="/app/dashboard.html">← Mis tarjetas</a></header><div class="content"><div id="hero"></div><div class="grid grid-4" style="margin-top:18px"><div class="card metric"><div class="label">Clientes</div><div class="value" id="clients">0</div></div><div class="card metric"><div class="label">Movimientos</div><div class="value" id="moves">0</div></div><div class="card metric"><div class="label">Canjes / usos</div><div class="value" id="redeems">0</div></div><div class="card metric"><div class="label">Actividad 30 días</div><div class="value" id="month">0</div></div></div><div class="section-title"><h2>Actividad reciente</h2></div><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Cliente</th><th>Movimiento</th><th>Fecha</th></tr></thead><tbody id="activity"></tbody></table></div></div></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/app/assets/config.js?v=20260906-stafffix3"></script><script src="/app/assets/app.js?v=20260906-stafffix3"></script><script>ENLA.bindShell();(async()=>{try{await ENLA.requireAuth();const id=new URLSearchParams(location.search).get('id');if(!id)throw new Error('Falta la tarjeta.');const p=await ENLA.getProgram(id);if(!p)throw new Error('No se encontró esta tarjeta.');const type=p.program_type==='cashback'?'Cashback':p.program_type==='visits'?'Visitas':p.program_type==='access'?'Identificación / Acceso':'Sellos';document.querySelector('#hero').innerHTML=`<div class="detail-hero" style="background:linear-gradient(145deg,${p.primary_color},${p.secondary_color||p.primary_color})"><div style="display:flex;align-items:center;gap:16px">${p.logo_url?`<img class="detail-hero-logo" src="${p.logo_url}">`:''}<div><span class="badge">${type}</span><h2 style="margin:8px 0 4px">${p.program_name}</h2><div style="opacity:.8">${p.display_name||''}</div></div></div><div class="detail-actions"><a class="btn btn-secondary btn-sm" href="/app/program.html?id=${p.id}">Personalizar</a><a class="btn btn-secondary btn-sm" href="/app/customers.html?program=${p.id}">Clientes y QR</a><a class="btn btn-secondary btn-sm" href="/app/scan.html?program=${p.id}">Escanear</a><a class="btn btn-secondary btn-sm" href="/app/staff.html?program=${p.id}">Empleados</a></div></div>`;const {data:customers,count}=await ENLA.sb.from('rewards_customers').select('*',{count:'exact'}).eq('program_id',id);const {data:tx}=await ENLA.sb.from('rewards_loyalty_transactions').select('type,amount,created_at,rewards_customers(name)').eq('program_id',id).order('created_at',{ascending:false});document.querySelector('#clients').textContent=count||0;document.querySelector('#moves').textContent=(tx||[]).length;document.querySelector('#redeems').textContent=(tx||[]).filter(x=>x.type==='redeem'||x.type==='spend'||x.type==='access_in'||x.type==='access_entry').length;const cutoff=Date.now()-30*86400000;document.querySelector('#month').textContent=(tx||[]).filter(x=>new Date(x.created_at).getTime()>=cutoff).length;document.querySelector('#activity').innerHTML=(tx||[]).slice(0,10).map(x=>`<tr><td>${x.rewards_customers?.name||'Cliente'}</td><td>${x.type==='spend'?'Saldo usado':x.type==='cashback'?'Cashback':x.type==='visit_use'?'Visita usada':x.type==='visit_renew'?'Paquete renovado':x.type==='deactivate'?'Tarjeta desactivada':x.type==='access_in'?'Entrada':x.type==='access_out'?'Salida':x.type==='access_entry'?'Acceso':x.type==='access_renew'?'Vigencia renovada':x.type==='visit'?'Visita':x.type==='redeem'?'Canje':'Sello'}</td><td>${new Date(x.created_at).toLocaleString('es-MX')}</td></tr>`).join('')||'<tr><td colspan="3" class="muted">Sin actividad todavía.</td></tr>';}catch(e){document.querySelector('.content').innerHTML=`<div class="error">${e.message}</div>`}})();</script></body></html>
