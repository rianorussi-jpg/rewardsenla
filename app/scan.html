</nav><div class="side-bottom"><button class="btn btn-secondary" id="signOut" style="width:100%">Cerrar sesión</button></div></aside><div class="overlay"></div><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="btn btn-secondary mobile-menu" id="mobileMenu">☰</button><h1>Escanear</h1></div><a class="btn btn-primary btn-sm" href="/app/program.html">Editar tarjeta</a></header><div class="content"><div class="scanner-box"><span class="badge">Modo registro</span><h2>Escanear tarjeta del cliente</h2><p class="muted">Escanea el QR único de la tarjeta del cliente o escribe su código manualmente.</p><div class="scan-actions"><button class="btn btn-primary" id="startCamera">Abrir cámara</button><button class="btn btn-secondary hidden" id="stopCamera">Cerrar cámara</button></div><div id="reader" class="scanner-live hidden"></div><div class="manual-code"><input id="code" placeholder="Código del cliente"><button class="btn btn-primary" id="find">Buscar</button></div><div id="scanResult" style="margin-top:18px"></div></div></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script src="/app/assets/config.js?v=20260906-redeem1"></script><script src="/app/assets/app.js?v=20260906-redeem1"></script><script>ENLA.bindShell();ENLA.navActive();(async()=>{try{await ENLA.requireAuth();ENLA.ensureConfigured();const out=document.querySelector('#scanResult'),input=document.querySelector('#code');let scanner=null,busy=false,program=await ENLA.getProgram();const goal=Number(program?.goal_count||6);
async function render(data,notice=''){const value=Number(data.current_value||0),ready=value>=goal;out.innerHTML=`${notice?`<div class="success" style="margin-bottom:10px">${notice}</div>`:''}<div class="card" style="text-align:left"><div class="person"><div class="avatar">${ENLA.initials(data.name)}</div><div><b>${data.name}</b><div class="muted small">${data.email||data.phone||data.public_code}</div></div></div><p><b>Progreso:</b> ${value} / ${goal}</p>${ready?`<div class="success" style="margin-bottom:12px">🎁 Recompensa lista: ${program?.reward_text||'Recompensa'}</div>`:''}<div style="display:flex;gap:8px;flex-wrap:wrap">${ready?'<button class="btn btn-primary btn-sm" id="redeemNow">Canjear recompensa</button>':'<button class="btn btn-primary btn-sm" id="addNow">+ Agregar sello</button>'}<a class="btn btn-secondary btn-sm" href="/app/history.html">Ver historial</a></div></div>`;
if(!ready)document.querySelector('#addNow').onclick=async()=>{try{const r=await ENLA.addStamp(data.id);data.current_value=Number(r.current_value);await render(data,r.reward_ready?'🎉 Sello agregado. ¡Recompensa desbloqueada!':'Sello agregado correctamente.')}catch(e){alert(e.message)}};
else document.querySelector('#redeemNow').onclick=async()=>{if(!confirm('¿Ya entregaste la recompensa? El progreso volverá a 0.'))return;try{const r=await ENLA.redeemReward(data.id);data.current_value=0;await render(data,'✅ Recompensa canjeada. Nuevo ciclo iniciado en 0 / '+goal+'.')}catch(e){alert(e.message)}};}
async function findCode(raw){if(busy)return;const code=(raw||'').trim().toUpperCase();if(!code){out.innerHTML='<div class="error">Escribe o escanea un código.</div>';return}busy=true;try{const b=await ENLA.getBusiness();if(!b)throw new Error('No se encontró el negocio asociado a esta cuenta.');const {data,error}=await ENLA.sb.from('rewards_customers').select('*').eq('business_id',b.id).eq('public_code',code).maybeSingle();if(error)throw error;if(!data){out.innerHTML='<div class="error">Este QR no pertenece a un cliente de tu negocio.</div>';return}await render(data)}catch(e){out.innerHTML='<div class="error">'+e.message+'</div>'}finally{busy=false}}
document.querySelector('#find').onclick=()=>findCode(input.value);input.addEventListener('keydown',e=>{if(e.key==='Enter')findCode(input.value)});document.querySelector('#startCamera').onclick=async()=>{try{const reader=document.querySelector('#reader');reader.classList.remove('hidden');scanner=new Html5Qrcode('reader');await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:230,height:230}},decoded=>{input.value=decoded;findCode(decoded)});document.querySelector('#startCamera').classList.add('hidden');document.querySelector('#stopCamera').classList.remove('hidden')}catch(e){out.innerHTML='<div class="error">No se pudo abrir la cámara: '+e.message+'</div>'}};document.querySelector('#stopCamera').onclick=async()=>{if(scanner){await scanner.stop();scanner.clear();scanner=null}document.querySelector('#reader').classList.add('hidden');document.querySelector('#startCamera').classList.remove('hidden');document.querySelector('#stopCamera').classList.add('hidden')}}catch(e){document.querySelector('#scanResult').innerHTML='<div class="error">'+e.message+'</div>'}})();</script></body></html>
