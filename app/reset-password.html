<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/favicon.png">
  <title>Nueva contraseña — Enla Cards</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app/assets/app.css?v=20260927-password1">
</head>
<body>
  <div class="auth-shell">
    <section class="auth-side">
      <a class="auth-brand" href="/">enla.<span>cards</span></a>
      <div class="auth-copy">
        <h1>Crea una nueva contraseña.</h1>
        <p>Elige una contraseña nueva para volver a entrar a tu panel de Enla Cards.</p>
        <div class="auth-preview">
          <span class="chip">🔐 Acceso protegido</span>
          <span class="chip">✓ Cambio inmediato</span>
        </div>
      </div>
    </section>

    <main class="auth-main">
      <form class="auth-card" id="form">
        <h2>Nueva contraseña</h2>
        <p class="muted" id="intro">Verificando tu enlace de recuperación...</p>

        <div id="notice" class="hidden"></div>

        <div class="form-grid" id="fields" style="display:none">
          <div class="field">
            <label for="password">Nueva contraseña</label>
            <input id="password" type="password" minlength="6" required autocomplete="new-password" placeholder="Mínimo 6 caracteres">
          </div>

          <div class="field">
            <label for="passwordConfirm">Confirmar contraseña</label>
            <input id="passwordConfirm" type="password" minlength="6" required autocomplete="new-password" placeholder="Repite tu contraseña">
          </div>

          <button class="btn btn-primary" id="submitBtn" type="submit">Guardar nueva contraseña</button>
        </div>

        <p class="small muted" style="text-align:center;margin-top:18px">
          <a href="/app/login.html" style="color:#3389dd;font-weight:800">Volver al login</a>
        </p>
      </form>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/app/assets/config.js?v=20260906-geonotify1"></script>
  <script src="/app/assets/app.js?v=20260906-geonotify1"></script>
  <script>
    const form = document.querySelector('#form');
    const fields = document.querySelector('#fields');
    const intro = document.querySelector('#intro');
    const notice = document.querySelector('#notice');
    const submitBtn = document.querySelector('#submitBtn');

    let recoveryReady = false;

    async function enableIfSessionExists() {
      try {
        ENLA.ensureConfigured();

        const { data, error } = await ENLA.sb.auth.getSession();
        if (error) throw error;

        if (data?.session) {
          recoveryReady = true;
          fields.style.display = 'grid';
          intro.textContent = 'Escribe y confirma tu nueva contraseña.';
        }
      } catch (err) {
        ENLA.msg(notice, err.message || String(err));
      }
    }

    ENLA.ensureConfigured();

    ENLA.sb.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY' || (session && !recoveryReady)) {
        recoveryReady = true;
        fields.style.display = 'grid';
        intro.textContent = 'Escribe y confirma tu nueva contraseña.';
      }
    });

    enableIfSessionExists();

    setTimeout(() => {
      if (!recoveryReady) {
        intro.textContent = 'Este enlace no es válido o ya venció.';
        ENLA.msg(
          notice,
          'Solicita un nuevo enlace desde “¿Olvidaste tu contraseña?”.'
        );
      }
    }, 2500);

    form.onsubmit = async (event) => {
      event.preventDefault();

      if (!recoveryReady) {
        ENLA.msg(notice, 'El enlace de recuperación no es válido o ya venció.');
        return;
      }

      const password = document.querySelector('#password').value;
      const passwordConfirm = document.querySelector('#passwordConfirm').value;

      if (password.length < 6) {
        ENLA.msg(notice, 'La contraseña debe tener al menos 6 caracteres.');
        return;
      }

      if (password !== passwordConfirm) {
        ENLA.msg(notice, 'Las contraseñas no coinciden.');
        return;
      }

      const original = submitBtn.textContent;
      submitBtn.disabled = true;
      submitBtn.textContent = 'Guardando...';

      try {
        const { error } = await ENLA.sb.auth.updateUser({ password });
        if (error) throw error;

        ENLA.msg(notice, 'Contraseña actualizada. Ya puedes iniciar sesión.', 'success');
        fields.style.display = 'none';

        setTimeout(async () => {
          try { await ENLA.sb.auth.signOut(); } catch (_) {}
          location.href = '/app/login.html';
        }, 1200);
      } catch (err) {
        ENLA.msg(notice, err.message || String(err));
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = original;
      }
    };
  </script>
</body>
</html>
