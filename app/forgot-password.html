<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/favicon.png">
  <title>Recuperar contraseña — Enla Cards</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app/assets/app.css?v=20260927-password1">
</head>
<body>
  <div class="auth-shell">
    <section class="auth-side">
      <a class="auth-brand" href="/">enla.<span>cards</span></a>
      <div class="auth-copy">
        <h1>Recupera tu acceso.</h1>
        <p>Te enviaremos un enlace seguro para que puedas crear una nueva contraseña.</p>
        <div class="auth-preview">
          <span class="chip">🔒 Enlace seguro</span>
          <span class="chip">✉️ Directo a tu correo</span>
          <span class="chip">⚡ En pocos minutos</span>
        </div>
      </div>
    </section>

    <main class="auth-main">
      <form class="auth-card" id="form">
        <h2>Recuperar contraseña</h2>
        <p class="muted">Escribe el correo con el que creaste tu cuenta de Enla Cards.</p>

        <div id="notice" class="hidden"></div>

        <div class="form-grid">
          <div class="field">
            <label for="email">Correo</label>
            <input id="email" type="email" required autocomplete="email" placeholder="tu@negocio.com">
          </div>

          <button class="btn btn-primary" id="submitBtn" type="submit">Enviar enlace</button>

          <p class="small muted" style="text-align:center">
            <a href="/app/login.html" style="color:#3389dd;font-weight:800">← Volver a iniciar sesión</a>
          </p>
        </div>
      </form>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/app/assets/config.js?v=20260906-geonotify1"></script>
  <script src="/app/assets/app.js?v=20260906-geonotify1"></script>
  <script>
    const form = document.querySelector('#form');
    const notice = document.querySelector('#notice');
    const submitBtn = document.querySelector('#submitBtn');

    form.onsubmit = async (event) => {
      event.preventDefault();

      const email = document.querySelector('#email').value.trim().toLowerCase();
      if (!email) return;

      const original = submitBtn.textContent;
      submitBtn.disabled = true;
      submitBtn.textContent = 'Enviando...';

      try {
        ENLA.ensureConfigured();

        const redirectTo = `${location.origin}/app/reset-password.html`;

        const { error } = await ENLA.sb.auth.resetPasswordForEmail(email, {
          redirectTo
        });

        if (error) throw error;

        ENLA.msg(
          notice,
          'Si existe una cuenta con ese correo, recibirás un enlace para cambiar tu contraseña.',
          'success'
        );
        form.reset();
      } catch (err) {
        ENLA.msg(notice, err.message || String(err));
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = original;
      }
    };
  </script>
</body>
</html>
