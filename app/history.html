<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clientes — rewards.enla</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/app/assets/app.css?v=20260906-panel2"></head><body><div class="app-shell"><aside class="sidebar"><a class="side-brand" href="/">rewards.<span>enla</span></a><nav class="nav-list">
<a class="nav-item" href="/app/dashboard.html">▦ Mis tarjetas</a>
<a class="nav-item" href="/app/customers.html">♙ Clientes</a>
<a class="nav-item" href="/app/scan.html">⌗ Escanear</a>
<a class="nav-item" href="/app/history.html">◴ Historial</a>
<a class="nav-item" href="/app/settings.html">⚙ Ajustes</a></nav><div class="side-bottom"><button class="btn btn-secondary" id="signOut" style="width:100%">Cerrar sesión</button></div></aside><div class="overlay"></div><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="btn btn-secondary mobile-menu" id="mobileMenu">☰</button><h1>Historial</h1></div><a class="btn btn-primary btn-sm" href="/app/scan.html">Escanear cliente</a></header><div class="content"><div class="section-title" style="margin-top:0"><div><h2>Movimientos</h2><p class="muted small">Registro de progreso otorgado y recompensas canjeadas.</p></div><select id="filter" class="btn btn-secondary"><option value="all">Todos</option><option value="stamp">Sellos</option><option value="cashback">Cashback agregado</option><option value="spend">Saldo usado</option><option value="visit">Visitas</option><option value="redeem">Canjes</option></select></div><div class="grid grid-3" style="margin-bottom:18px"><div class="card metric"><div class="label">Progreso otorgado</div><div class="value" id="stamps">0</div></div><div class="card metric"><div class="label">Canjes</div><div class="value" id="redeems">0</div></div><div class="card metric"><div class="label">Movimientos</div><div class="value" id="total">0</div></div></div><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Fecha</th><th>Cliente</th><th>Movimiento</th><th>Detalle</th></tr></thead><tbody id="rows"><tr><td colspan="4" class="muted">Cargando...</td></tr></tbody></table></div></div></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/app/assets/config.js?v=20260906-panel2"></script><script src="/app/assets/app.js?v=20260906-panel2"></script><script>ENLA.bindShell();ENLA.navActive();(async()=>{try{await ENLA.requireAuth();ENLA.ensureConfigured();const b=await ENLA.getBusiness();const rows=document.querySelector('#rows'),filter=document.querySelector('#filter');let all=[];async function load(){const {data,error}=await ENLA.sb.from('rewards_loyalty_transactions').select('id,type,amount,note,created_at,customer_id,rewards_customers(name,public_code)').eq('business_id',b.id).order('created_at',{ascending:false}).limit(500);if(error)throw error;all=data||[];document.querySelector('#stamps').textContent=all.filter(x=>['stamp','cashback','visit'].includes(x.type)).reduce((a,x)=>a+Number(x.amount||1),0);document.querySelector('#redeems').textContent=all.filter(x=>x.type==='redeem').length;document.querySelector('#total').textContent=all.length;render()}function render(){const f=filter.value;const data=f==='all'?all:all.filter(x=>x.type===f);rows.innerHTML=data.length?data.map(x=>{const c=x.rewards_customers||{};const isRedeem=x.type==='redeem';return `<tr><td>${new Date(x.created_at).toLocaleString('es-MX')}</td><td><b>${c.name||'Cliente'}</b><div class="muted small">${c.public_code||''}</div></td><td><span class="badge ${isRedeem?'':'green'}">${isRedeem?'🎁 Canje':x.type==='cashback'?'＋ Cashback':x.type==='spend'?'− Saldo usado':x.type==='visit'?'＋ Visita':'＋ Sello'}</span></td><td>${x.note|| (isRedeem?'Recompensa entregada':x.type==='cashback'?'Cashback agregado':x.type==='spend'?'Saldo utilizado':x.type==='visit'?'Visita registrada':'Sello agregado')}</td></tr>`}).join(''):'<tr><td colspan="4" class="muted">No hay movimientos con este filtro.</td></tr>'}filter.onchange=render;await load()}catch(e){document.querySelector('#rows').innerHTML=`<tr><td colspan="4"><div class="error">${e.message}</div></td></tr>`}})();</script></body></html>
