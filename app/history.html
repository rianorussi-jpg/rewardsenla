<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Historial — rewards.enla</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/app/assets/app.css?v=20260906-stafffix3"></head><body><div class="app-shell"><aside class="sidebar"><a class="side-brand" href="/">rewards.<span>enla</span></a><nav class="nav-list"></nav><div class="side-bottom"><button class="btn btn-secondary" id="signOut" style="width:100%">Cerrar sesión</button></div></aside><div class="overlay"></div><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="btn btn-secondary mobile-menu" id="mobileMenu">☰</button><div><h1 id="pageTitle">Historial</h1><div class="topbar-sub" id="scopeLabel">Todos tus programas</div></div></div><a class="btn btn-primary btn-sm" id="scanLink" href="/app/scan.html">Escanear cliente</a></header><div class="content"><div class="section-title" style="margin-top:0"><div><h2>Movimientos</h2><p class="muted small">Consulta sellos, cashback, visitas, canjes y correcciones.</p></div><select id="filter" class="select-control"><option value="all">Todos los movimientos</option><option value="stamp">Sellos</option><option value="cashback">Cashback agregado</option><option value="spend">Saldo usado</option><option value="adjustment">Correcciones de saldo</option><option value="visit_use">Visitas usadas</option><option value="visit_renew">Renovaciones</option><option value="redeem">Canjes</option><option value="access_in">Entradas</option><option value="access_out">Salidas</option><option value="access_entry">Accesos</option><option value="access_renew">Renovaciones de vigencia</option></select></div><div class="grid grid-3" style="margin-bottom:18px"><div class="card metric"><div class="label">Progreso / saldo agregado</div><div class="value" id="progress">0</div></div><div class="card metric"><div class="label">Canjes / usos de saldo</div><div class="value" id="redeems">0</div></div><div class="card metric"><div class="label">Movimientos</div><div class="value" id="total">0</div></div></div><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Fecha</th><th>Cliente</th><th>Movimiento</th><th>Detalle</th></tr></thead><tbody id="rows"><tr><td colspan="4" class="muted">Cargando...</td></tr></tbody></table></div></div></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/app/assets/config.js?v=20260906-stafffix3"></script><script src="/app/assets/app.js?v=20260906-stafffix3"></script><script>ENLA.bindShell();(async()=>{try{await ENLA.requireAuth();const b=await ENLA.getBusiness(),pid=new URLSearchParams(location.search).get('program'),rows=document.querySelector('#rows'),filter=document.querySelector('#filter');let all=[],program=null;if(pid){program=await ENLA.getProgram(pid);if(!program)throw new Error('No se encontró la tarjeta seleccionada.');document.querySelector('#scopeLabel').textContent=program.program_name;document.querySelector('#scanLink').href='/app/scan.html?program='+program.id}
const labels={stamp:'Sello',cashback:'Cashback',spend:'Saldo usado',adjustment:'Corrección',visit_use:'Visita usada',visit_renew:'Paquete renovado',deactivate:'Tarjeta desactivada',redeem:'Canje',visit:'Visita',access_in:'Entrada',access_out:'Salida',access_entry:'Acceso',access_renew:'Vigencia renovada'};
async function load(){let q=ENLA.sb.from('rewards_loyalty_transactions').select('id,type,amount,note,created_at,customer_id,rewards_customers(name,public_code)').eq('business_id',b.id).order('created_at',{ascending:false}).limit(500);if(pid)q=q.eq('program_id',pid);const {data,error}=await q;if(error)throw error;all=data||[];document.querySelector('#progress').textContent=all.filter(x=>['stamp','cashback'].includes(x.type)).reduce((a,x)=>a+Math.abs(Number(x.amount||1)),0).toFixed(all.some(x=>x.type==='cashback')?2:0);document.querySelector('#redeems').textContent=all.filter(x=>['redeem','spend','access_in','access_entry'].includes(x.type)).length;document.querySelector('#total').textContent=all.length;render()}
function render(){const f=filter.value,data=f==='all'?all:all.filter(x=>x.type===f);rows.innerHTML=data.length?data.map(x=>{const c=x.rewards_customers||{},kind=labels[x.type]||x.type;return `<tr><td>${new Date(x.created_at).toLocaleString('es-MX')}</td><td><b>${c.name||'Cliente'}</b><div class="muted small">${c.public_code||''}</div></td><td><span class="badge ${x.type==='redeem'||x.type==='spend'?'':'green'}">${kind}</span></td><td>${x.note||kind}</td></tr>`}).join(''):'<tr><td colspan="4" class="muted">No hay movimientos con este filtro.</td></tr>'}filter.onchange=render;await load()}catch(e){document.querySelector('#rows').innerHTML=`<tr><td colspan="4"><div class="error">${e.message}</div></td></tr>`}})();</script></body></html>
