</nav><div class="side-bottom"><button class="btn btn-secondary" id="signOut" style="width:100%">Cerrar sesión</button></div></aside><div class="overlay"></div><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="btn btn-secondary mobile-menu" id="mobileMenu">☰</button><h1>Historial</h1></div><a class="btn btn-primary btn-sm" href="/app/scan.html">Escanear cliente</a></header><div class="content"><div class="section-title" style="margin-top:0"><div><h2>Movimientos</h2><p class="muted small">Registro de sellos otorgados y recompensas canjeadas.</p></div><select id="filter" class="btn btn-secondary"><option value="all">Todos</option><option value="stamp">Sellos</option><option value="redeem">Canjes</option></select></div><div class="grid grid-3" style="margin-bottom:18px"><div class="card metric"><div class="label">Sellos otorgados</div><div class="value" id="stamps">0</div></div><div class="card metric"><div class="label">Canjes</div><div class="value" id="redeems">0</div></div><div class="card metric"><div class="label">Movimientos</div><div class="value" id="total">0</div></div></div><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Fecha</th><th>Cliente</th><th>Movimiento</th><th>Detalle</th></tr></thead><tbody id="rows"><tr><td colspan="4" class="muted">Cargando...</td></tr></tbody></table></div></div></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/app/assets/config.js?v=20260906-redeem1"></script><script src="/app/assets/app.js?v=20260906-redeem1"></script><script>ENLA.bindShell();ENLA.navActive();(async()=>{try{await ENLA.requireAuth();ENLA.ensureConfigured();const b=await ENLA.getBusiness();const rows=document.querySelector('#rows'),filter=document.querySelector('#filter');let all=[];async function load(){const {data,error}=await ENLA.sb.from('rewards_loyalty_transactions').select('id,type,amount,note,created_at,customer_id,rewards_customers(name,public_code)').eq('business_id',b.id).order('created_at',{ascending:false}).limit(500);if(error)throw error;all=data||[];document.querySelector('#stamps').textContent=all.filter(x=>x.type==='stamp').reduce((a,x)=>a+Number(x.amount||1),0);document.querySelector('#redeems').textContent=all.filter(x=>x.type==='redeem').length;document.querySelector('#total').textContent=all.length;render()}function render(){const f=filter.value;const data=f==='all'?all:all.filter(x=>x.type===f);rows.innerHTML=data.length?data.map(x=>{const c=x.rewards_customers||{};const isRedeem=x.type==='redeem';return `<tr><td>${new Date(x.created_at).toLocaleString('es-MX')}</td><td><b>${c.name||'Cliente'}</b><div class="muted small">${c.public_code||''}</div></td><td><span class="badge ${isRedeem?'':'green'}">${isRedeem?'🎁 Canje':'＋ Sello'}</span></td><td>${x.note|| (isRedeem?'Recompensa entregada':'Sello agregado')}</td></tr>`}).join(''):'<tr><td colspan="4" class="muted">No hay movimientos con este filtro.</td></tr>'}filter.onchange=render;await load()}catch(e){document.querySelector('#rows').innerHTML=`<tr><td colspan="4"><div class="error">${e.message}</div></td></tr>`}})();</script></body></html>
