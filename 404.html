<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Página no encontrada · Enla Cards</title>
  <meta name="robots" content="noindex,follow">
  <link rel="icon" href="/assets/favicon.png">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,Manrope,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#123455}
    body{
      min-height:100vh;
      background:
        radial-gradient(circle at 15% 12%,rgba(68,153,247,.14),transparent 32%),
        radial-gradient(circle at 86% 86%,rgba(34,190,153,.12),transparent 28%),
        #f7faff;
      display:flex;
      flex-direction:column;
    }
    .topbar{
      width:min(1180px,calc(100% - 40px));
      margin:0 auto;
      padding:26px 0;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }
    .brand img{display:block;width:auto;height:34px;max-width:170px}
    .home-link{
      color:#123455;
      font-weight:750;
      font-size:14px;
      text-decoration:none;
      padding:10px 15px;
      border-radius:999px;
      border:1px solid rgba(18,52,85,.12);
      background:rgba(255,255,255,.72);
      backdrop-filter:blur(10px);
    }
    main{
      flex:1;
      width:min(920px,calc(100% - 36px));
      margin:0 auto;
      display:grid;
      place-items:center;
      padding:40px 0 90px;
    }
    .error-card{
      position:relative;
      width:100%;
      overflow:hidden;
      text-align:center;
      background:rgba(255,255,255,.92);
      border:1px solid rgba(18,52,85,.08);
      box-shadow:0 24px 70px rgba(18,52,85,.10);
      border-radius:32px;
      padding:74px 34px 66px;
    }
    .error-card:before,.error-card:after{
      content:"";
      position:absolute;
      border-radius:50%;
      pointer-events:none;
    }
    .error-card:before{
      width:220px;height:220px;
      background:rgba(68,153,247,.09);
      top:-110px;left:-75px;
    }
    .error-card:after{
      width:180px;height:180px;
      background:rgba(34,190,153,.08);
      right:-70px;bottom:-90px;
    }
    .code{
      position:relative;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:132px;
      height:52px;
      padding:0 20px;
      border-radius:999px;
      background:#edf6ff;
      color:#4499f7;
      font-size:15px;
      font-weight:850;
      letter-spacing:.13em;
      margin-bottom:24px;
    }
    h1{
      position:relative;
      margin:0 auto 14px;
      max-width:650px;
      font-size:clamp(34px,6vw,62px);
      line-height:1.02;
      letter-spacing:-.045em;
      color:#123455;
    }
    p{
      position:relative;
      margin:0 auto;
      max-width:560px;
      color:#6b7f92;
      font-size:17px;
      line-height:1.65;
    }
    .actions{
      position:relative;
      display:flex;
      gap:12px;
      justify-content:center;
      flex-wrap:wrap;
      margin-top:30px;
    }
    .btn{
      display:inline-flex;
      min-height:48px;
      align-items:center;
      justify-content:center;
      padding:0 20px;
      border-radius:14px;
      font-size:14px;
      font-weight:800;
      text-decoration:none;
      transition:transform .16s ease,box-shadow .16s ease,background .16s ease;
    }
    .btn:hover{transform:translateY(-1px)}
    .btn-primary{
      background:#4499f7;
      color:#fff;
      box-shadow:0 10px 24px rgba(68,153,247,.24);
    }
    .btn-secondary{
      color:#123455;
      background:#fff;
      border:1px solid rgba(18,52,85,.12);
    }
    .mini{
      position:relative;
      margin-top:34px;
      font-size:12px;
      color:#9aabba;
    }
    @media(max-width:620px){
      .topbar{width:calc(100% - 28px);padding:18px 0}
      .brand img{height:30px}
      .home-link{display:none}
      main{width:calc(100% - 24px);padding:20px 0 50px}
      .error-card{padding:58px 22px 48px;border-radius:24px}
      p{font-size:15px}
      .actions{flex-direction:column}
      .btn{width:100%}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Enla Cards">
      <img src="/assets/enla-cards-logo.png" alt="Enla Cards">
    </a>
    <a class="home-link" href="/">Ir al inicio</a>
  </header>

  <main>
    <section class="error-card">
      <div class="code">ERROR 404</div>
      <h1>Esta página no existe.</h1>
      <p>El enlace que abriste puede estar incorrecto, haber cambiado o ya no estar disponible.</p>
      <div class="actions">
        <a class="btn btn-primary" href="/">Volver a Enla Cards</a>
        <a class="btn btn-secondary" href="/app/dashboard.html">Ir a mi dashboard</a>
      </div>
      <div class="mini">enlacards.com</div>
    </section>
  </main>
</body>
</html>
